<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推し活・コンテンツ管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        oshi: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md shadow-pink-500/20">
                    <i class="fa-solid fa-heart-pulse text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-pink-600 to-rose-500 bg-clip-text text-transparent">推し活マネージャー</h1>
                    <p class="text-xs text-slate-400">コンテンツ・スケジュール一元管理</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openModal()" class="flex items-center justify-center w-12 h-12 bg-pink-600 hover:bg-pink-700 active:scale-95 text-white rounded-full shadow-lg shadow-pink-500/30 transition-all font-bold text-xl" title="コンテンツを追加">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6 overflow-x-auto">
            <button onclick="switchTab('list')" id="nav-list" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap border-pink-600 text-pink-600">
                <i class="fa-solid fa-list-ul mr-1.5"></i> 一覧表示
            </button>
            <button onclick="switchTab('calendar')" id="nav-calendar" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap border-transparent text-slate-500 hover:text-slate-700">
                <i class="fa-solid fa-calendar-days mr-1.5"></i> カレンダー
            </button>
            <button onclick="switchTab('routine')" id="nav-routine" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap border-transparent text-slate-500 hover:text-slate-700">
                <i class="fa-solid fa-rotate mr-1.5"></i> 定例管理
            </button>
            <button onclick="switchTab('deadlines')" id="nav-deadlines" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap border-transparent text-slate-500 hover:text-slate-700">
                <i class="fa-solid fa-clock-rotate-left mr-1.5"></i> 締め切り管理
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 overflow-y-auto">
        
        <!-- Tab 1: List View -->
        <section id="tab-list" class="space-y-4">
            <!-- Filter & Search Bar Area -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    <div class="relative flex-1 md:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="search-input" oninput="renderList()" placeholder="タイトルやメンバーを検索..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500">
                    </div>
                    <select id="category-filter" onchange="renderList()" class="py-2 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500">
                        <option value="">全カテゴリ</option>
                        <option value="抽選・応募">抽選・応募</option>
                        <option value="テレビ・配信">テレビ・配信</option>
                        <option value="雑誌・WEB">雑誌・WEB</option>
                        <option value="グッズ">グッズ</option>
                        <option value="ライブ">ライブ</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <label class="flex items-center space-x-2 text-sm text-slate-600 cursor-pointer select-none bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 hover:bg-slate-100 transition-colors">
                        <input type="checkbox" id="unresolved-filter" onchange="renderList()" class="rounded text-pink-600 focus:ring-pink-500 w-4 h-4">
                        <span>未対応のみ表示</span>
                    </label>
                    <select id="sort-select" onchange="renderList()" class="py-2 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500">
                        <option value="date-asc">日付順 (近い順)</option>
                        <option value="date-desc">日付順 (遠い順)</option>
                        <option value="created">登録順</option>
                    </select>
                </div>
            </div>

            <!-- Content Grid/List -->
            <div id="content-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Tab 2: Calendar View -->
        <section id="tab-calendar" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <button onclick="changeMonth(-1)" class="w-9 h-9 flex items-center justify-center rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendar-title" class="text-lg font-bold text-slate-800 w-36 text-center">2026年 10月</h2>
                    <button onclick="changeMonth(1)" class="w-9 h-9 flex items-center justify-center rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600"><i class="fa-solid fa-chevron-right"></i></button>
                    <button onclick="goToCurrentMonth()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl font-medium text-slate-600 transition-colors">今月</button>
                </div>
                <div class="flex items-center space-x-3">
                    <select id="calendar-view-mode" onchange="renderCalendar()" class="py-2 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20">
                        <option value="month">月別表示</option>
                        <option value="week">週別表示</option>
                        <option value="day">日別表示</option>
                    </select>
                </div>
            </div>
            <div id="calendar-container" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-4">
                <!-- Calendar grid rendered dynamically -->
            </div>
        </section>

        <!-- Tab 3: Routine Management -->
        <section id="tab-routine" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">定例・毎週の予定管理</h2>
                    <p class="text-xs text-slate-400 mt-0.5">曜日ごとに繰り返し発生する推し活予定を自動展開します</p>
                </div>
                <button onclick="openRoutineModal()" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-md shadow-pink-500/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 定例を追加
                </button>
            </div>
            <div id="routine-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Populated dynamically -->
            </div>
        </section>

        <!-- Tab 4: Deadlines Management -->
        <section id="tab-deadlines" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-800">直近の締め切り一覧</h2>
                <p class="text-xs text-slate-400 mt-0.5">応募や販売の締め切りが迫っているアイテムです</p>
            </div>
            <div id="deadlines-list" class="space-y-3">
                <!-- Populated dynamically -->
            </div>
        </section>

    </main>

    <!-- Content Add/Edit Modal -->
    <div id="content-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 my-auto">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">新規コンテンツ追加</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="content-form" onsubmit="saveContent(event)" class="space-y-4 pt-4">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">タイトル *</label>
                    <input type="text" id="item-title" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500" placeholder="例: 1st写真集 発売記念イベント">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">カテゴリ</label>
                        <select id="item-category" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500">
                            <option value="抽選・応募">抽選・応募</option>
                            <option value="テレビ・配信">テレビ・配信</option>
                            <option value="雑誌・WEB">雑誌・WEB</option>
                            <option value="グッズ">グッズ</option>
                            <option value="ライブ">ライブ</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">メンバー・推し</label>
                        <input type="text" id="item-member" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500" placeholder="例: メンバー名">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label id="label-start-date" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">開始日 / 応募開始</label>
                        <input type="date" id="item-start-date" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500">
                    </div>
                    <div>
                        <label id="label-end-date" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">終了日 / 応募締め切り</label>
                        <input type="date" id="item-end-date" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">ステータス</label>
                        <select id="item-status" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500">
                            <option value="未対応">未対応</option>
                            <option value="応募済・完了">応募済・完了</option>
                            <option value="当選！">当選！</option>
                            <option value="落選">落選</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">外部リンクURL</label>
                        <input type="url" id="item-url" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500" placeholder="https://...">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">メモ</label>
                    <textarea id="item-memo" rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500" placeholder="当選発表日や価格など..."></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50">キャンセル</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-pink-600 hover:bg-pink-700 text-sm font-medium text-white shadow-md shadow-pink-500/20">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detail View Modal (Separate from Edit) -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 my-auto space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div class="flex items-center space-x-2">
                    <span id="detail-category-badge" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-pink-100 text-pink-700">カテゴリ</span>
                    <span id="detail-status-badge" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-700">ステータス</span>
                </div>
                <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <h3 id="detail-title" class="text-xl font-bold text-slate-800 mb-1">コンテンツタイトル</h3>
                <p id="detail-member" class="text-sm text-slate-500 flex items-center gap-1.5"><i class="fa-solid fa-user-tag text-pink-500"></i> <span id="detail-member-text">-</span></p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-2 text-sm">
                <div class="flex items-center gap-2 text-slate-600">
                    <i class="fa-regular fa-calendar text-pink-500 w-5"></i>
                    <span class="font-medium">期間:</span> <span id="detail-dates">-</span>
                </div>
                <div id="detail-url-container" class="flex items-center gap-2 text-slate-600 hidden">
                    <i class="fa-solid fa-link text-pink-500 w-5"></i>
                    <span class="font-medium">リンク:</span> 
                    <a id="detail-url-link" href="#" target="_blank" class="text-pink-600 hover:underline break-all flex items-center gap-1">
                        <span>サイトを開く</span> <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                </div>
            </div>
            <div>
                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">メモ</h4>
                <div id="detail-memo" class="p-3 bg-slate-50 rounded-xl text-sm text-slate-700 border border-slate-100 min-h-[60px] whitespace-pre-wrap">-</div>
            </div>
            <div class="flex items-center justify-between pt-2">
                <!-- Google Calendar integration button -->
                <a id="detail-gcal-btn" href="#" target="_blank" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition-all">
                    <i class="fa-brands fa-google"></i> Googleカレンダーに追加
                </a>
                <div class="flex gap-2">
                    <button id="detail-edit-btn" onclick="" class="px-3 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-medium"><i class="fa-solid fa-pen mr-1"></i> 編集</button>
                    <button id="detail-delete-btn" onclick="" class="px-3 py-2 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-sm font-medium"><i class="fa-solid fa-trash mr-1"></i> 削除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Routine Add/Edit Modal -->
    <div id="routine-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-800">定例予定の登録</h3>
                <button onclick="closeRoutineModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="routine-form" onsubmit="saveRoutine(event)" class="space-y-4 pt-4">
                <input type="hidden" id="routine-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">タイトル *</label>
                    <input type="text" id="routine-title" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20" placeholder="例: レギュラーラジオ番組">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">繰り返し曜日</label>
                    <select id="routine-day" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20">
                        <option value="1">月曜日</option>
                        <option value="2">火曜日</option>
                        <option value="3">水曜日</option>
                        <option value="4">木曜日</option>
                        <option value="5">金曜日</option>
                        <option value="6">土曜日</option>
                        <option value="0">日曜日</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">開始時間</label>
                        <input type="time" id="routine-time" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20" value="20:00">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">カテゴリ</label>
                        <select id="routine-category" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20">
                            <option value="テレビ・配信">テレビ・配信</option>
                            <option value="雑誌・WEB">雑誌・WEB</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeRoutineModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-600">キャンセル</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-pink-600 hover:bg-pink-700 text-sm font-medium text-white shadow-md">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>

        let contents = JSON.parse(localStorage.getItem('oshi_contents') || '[]');
        let routines = JSON.parse(localStorage.getItem('oshi_routines') || '[]');

        let currentCalendarDate = new Date();

        // Initialize sample data if empty
        if (contents.length === 0) {
            contents = [
                {

                    startDate: '2026-10-10',
                    endDate: '2026-10-25',

                },
                {
                    id: '3',

        }

        if (routines.length === 0) {
            routines = [
                { id: 'r1', title: 'レギュラーラジオ番組放送', day: 3, time: '21:00', category: 'テレビ・配信' },
                { id: 'r2', title: '公式YouTube生配信', day: 5, time: '20:00', category: 'テレビ・配信' }
            ];
            saveData();
        }

        function saveData() {
            localStorage.setItem('oshi_contents', JSON.stringify(contents));
            localStorage.setItem('oshi_routines', JSON.stringify(routines));
        }

        // Tab Switching
        function switchTab(tabId) {
            currentTab = tabId;
            ['list', 'calendar', 'routine', 'deadlines'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "py-3 px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap border-transparent text-slate-500 hover:text-slate-700";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "py-3 px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap border-pink-600 text-pink-600";

            if (tabId === 'list') renderList();
            if (tabId === 'calendar') renderCalendar();
            if (tabId === 'routine') renderRoutineList();
            if (tabId === 'deadlines') renderDeadlines();
        }

        // Category Color Mapping
        function getCategoryColor(cat) {
            switch(cat) {
                case '抽選・応募': return 'bg-purple-100 text-purple-700 border-purple-200';
                case 'ライブ': return 'bg-rose-100 text-rose-700 border-rose-200';
                case 'テレビ・配信': return 'bg-blue-100 text-blue-700 border-blue-200';
                case '雑誌・WEB': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
                case 'グッズ': return 'bg-amber-100 text-amber-700 border-amber-200';
                default: return 'bg-slate-100 text-slate-700 border-slate-200';
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case '未対応': return 'bg-rose-50 text-rose-600 border-rose-200';
                case '応募済・完了': return 'bg-blue-50 text-blue-600 border-blue-200';
                case '当選！': return 'bg-emerald-50 text-emerald-600 border-emerald-200';
                case '落選': return 'bg-slate-100 text-slate-500 border-slate-200';
                default: return 'bg-slate-50 text-slate-600 border-slate-200';
            }
        }

        // Google Calendar URL Generator
        function getGoogleCalendarUrl(item) {
            const title = encodeURIComponent(item.title + (item.member ? ` (${item.member})` : ''));
            const details = encodeURIComponent((item.memo || '') + (item.url ? `\n\nリンク: ${item.url}` : ''));
            
            // Format dates YYYYMMDD
            const startStr = item.startDate ? item.startDate.replace(/-/g, '') : '';
            // For GCal all-day event, end date needs to be next day or same for single day
            let endDateObj = new Date(item.endDate || item.startDate);
            endDateObj.setDate(endDateObj.getDate() + 1);
            const endStr = endDateObj.toISOString().slice(0,10).replace(/-/g, '');

            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startStr}/${endStr}&details=${details}`;
        }

        // Render List View
        function renderList() {
            const container = document.getElementById('content-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const unresolvedOnly = document.getElementById('unresolved-filter').checked;
            const sort = document.getElementById('sort-select').value;

            let filtered = contents.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(search) || (item.member && item.member.toLowerCase().includes(search));
                const matchCategory = !category || item.category === category;
                const matchUnresolved = !unresolvedOnly || item.status === '未対応';
                return matchSearch && matchCategory && matchUnresolved;
            });

            filtered.sort((a, b) => {
                if (sort === 'date-asc') return new Date(a.startDate) - new Date(b.startDate);
                if (sort === 'date-desc') return new Date(b.startDate) - new Date(a.startDate);
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200"><i class="fa-regular fa-folder-open text-3xl mb-2"></i><p>該当するコンテンツがありません</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div onclick="openDetailModal('${item.id}')" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-pink-300 transition-all cursor-pointer flex flex-col justify-between space-y-3 relative group">
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${getCategoryColor(item.category)}">${item.category}</span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${getStatusColor(item.status)}">${item.status}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base group-hover:text-pink-600 transition-colors line-clamp-2">${item.title}</h3>
                        ${item.member ? `<p class="text-xs text-slate-500 flex items-center gap-1.5"><i class="fa-solid fa-user-tag text-pink-400"></i> ${item.member}</p>` : ''}
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                        <div class="flex items-center gap-1.5">
                            <i class="fa-regular fa-calendar text-pink-500"></i>
                            <span>${item.startDate}${item.startDate !== item.endDate ? ` ～ ${item.endDate}` : ''}</span>
                        </div>
                        ${item.url ? `<span onclick="event.stopPropagation(); window.open('${item.url}', '_blank')" class="text-pink-600 hover:underline flex items-center gap-1 font-medium"><i class="fa-solid fa-link"></i> リンク</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Render Calendar View
        function changeMonth(diff) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + diff);
            renderCalendar();
        }

        function goToCurrentMonth() {
            currentCalendarDate = new Date();
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            const viewMode = document.getElementById('calendar-view-mode').value;
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            
            document.getElementById('calendar-title').innerText = `${year}年 ${month + 1}月`;

            if (viewMode === 'month') {
                renderMonthCalendar(year, month, container);
            } else if (viewMode === 'week') {
                renderWeekCalendar(container);
            } else {
                renderDayCalendar(container);
            }
        }

        function renderMonthCalendar(year, month, container) {
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startingDayOfWeek = firstDay.getDay();
            const totalDays = lastDay.getDate();

            let html = `
                <div class="grid grid-cols-7 gap-1 text-center font-semibold text-xs text-slate-400 pb-2 border-b border-slate-100">
                    <div class="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-500">土</div>
                </div>
                <div class="grid grid-cols-7 gap-1 auto-rows-fr pt-2">
            `;

            // Blank spaces for previous month
            for (let i = 0; i < startingDayOfWeek; i++) {
                html += `<div class="min-h-[90px] bg-slate-50/50 rounded-xl opacity-30"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                // Find matching contents for this day
                // 1. Application items: Start date or End date or Intermediate if needed
                // 2. Non-application items: Show on ALL days between startDate and endDate inclusive!
                // 3. Routine items based on day of week
                const dayOfWeek = new Date(year, month, day).getDay();

                const dayContents = contents.filter(item => {
                    if (item.category === '抽選・応募') {
                        return item.startDate === dateStr || item.endDate === dateStr;
                    } else {
                        return dateStr >= item.startDate && dateStr <= item.endDate;
                    }
                });

                const dayRoutines = routines.filter(r => r.day === dayOfWeek);

                const isToday = new Date().toISOString().slice(0, 10) === dateStr;

                html += `
                    <div class="min-h-[90px] bg-white border border-slate-100 rounded-xl p-1.5 flex flex-col justify-between hover:border-pink-300 transition-colors overflow-hidden">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold px-1.5 py-0.5 rounded-md ${isToday ? 'bg-pink-600 text-white' : 'text-slate-700'}">${day}</span>
                        </div>
                        <div class="space-y-1 overflow-y-auto max-h-[70px] custom-scrollbar">
                            ${dayContents.map(item => {
                                const isApp = item.category === '抽選・応募';
                                let badgeText = '';
                                if (isApp) {
                                    if (item.startDate === dateStr && item.endDate === dateStr) badgeText = '【応募】';
                                    else if (item.startDate === dateStr) badgeText = '【応募開始】';
                                    else if (item.endDate === dateStr) badgeText = '【締切】';
                                }
                                return `
                                    <div onclick="openDetailModal('${item.id}')" class="text-[10px] px-1.5 py-0.5 rounded bg-pink-50 text-pink-700 font-medium truncate cursor-pointer hover:bg-pink-100" title="${item.title}">
                                        ${badgeText} ${item.title}
                                    </div>
                                `;
                            }).join('')}
                            ${dayRoutines.map(r => `
                                <div class="text-[10px] px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 font-medium truncate">
                                    🕒 ${r.title}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderWeekCalendar(container) {
            // Simplified current week view
            const curr = new Date();
            const first = curr.getDate() - curr.getDay();
            let html = `<div class="space-y-3">`;
            for (let i = 0; i < 7; i++) {
                const d = new Date(curr.setDate(first + i));
                const dateStr = d.toISOString().slice(0, 10);
                const dayName = ['日', '月', '火', '水', '木', '金', '土'][i];
                
                const dayContents = contents.filter(item => {
                    if (item.category === '抽選・応募') return item.startDate === dateStr || item.endDate === dateStr;
                    return dateStr >= item.startDate && dateStr <= item.endDate;
                });

                html += `
                    <div class="p-3 bg-white border border-slate-200 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center space-x-3 w-32">
                            <span class="w-8 h-8 rounded-xl bg-pink-50 text-pink-600 font-bold flex items-center justify-center text-sm">${d.getDate()}</span>
                            <div>
                                <p class="text-xs font-semibold text-slate-400">${d.getMonth() + 1}月</p>
                                <p class="text-sm font-bold text-slate-800">${dayName}曜日</p>
                            </div>
                        </div>
                        <div class="flex-1 flex flex-wrap gap-2">
                            ${dayContents.length === 0 ? '<span class="text-xs text-slate-400">予定なし</span>' : ''}
                            ${dayContents.map(item => `
                                <span onclick="openDetailModal('${item.id}')" class="text-xs px-2.5 py-1 rounded-xl bg-pink-50 text-pink-700 font-medium cursor-pointer hover:bg-pink-100">
                                    ${item.title}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderDayCalendar(container) {
            const dateStr = currentCalendarDate.toISOString().slice(0, 10);
            const dayContents = contents.filter(item => {
                if (item.category === '抽選・応募') return item.startDate === dateStr || item.endDate === dateStr;
                return dateStr >= item.startDate && dateStr <= item.endDate;
            });

            container.innerHTML = `
                <div class="space-y-4">
                    <h3 class="text-base font-bold text-slate-800">${dateStr} の予定</h3>
                    <div class="space-y-2">
                        ${dayContents.length === 0 ? '<p class="text-sm text-slate-400">この日の予定はありません</p>' : ''}
                        ${dayContents.map(item => `
                            <div onclick="openDetailModal('${item.id}')" class="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer hover:border-pink-300">
                                <div>
                                    <span class="px-2 py-0.5 rounded-lg text-xs font-bold border ${getCategoryColor(item.category)}">${item.category}</span>
                                    <h4 class="font-bold text-slate-800 mt-1">${item.title}</h4>
                                    ${item.member ? `<p class="text-xs text-slate-500 mt-0.5">${item.member}</p>` : ''}
                                </div>
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-lg border ${getStatusColor(item.status)}">${item.status}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Render Routine List
        function renderRoutineList() {
            const container = document.getElementById('routine-list');
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            
            if (routines.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200"><p>登録された定例予定はありません</p></div>`;
                return;
            }

            container.innerHTML = routines.map(r => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="px-2 py-0.5 rounded-lg text-xs font-bold bg-pink-100 text-pink-700">毎週 ${days[r.day]}曜日</span>
                            <span class="text-xs font-medium text-slate-500">${r.time}～</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base">${r.title}</h3>
                        <span class="text-xs text-slate-400">${r.category}</span>
                    </div>
                    <button onclick="deleteRoutine('${r.id}')" class="w-9 h-9 rounded-xl border border-rose-200 text-rose-500 hover:bg-rose-50 flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-sm"></i></button>
                </div>
            `).join('');
        }

        // Render Deadlines
        function renderDeadlines() {
            const container = document.getElementById('deadlines-list');
            const today = new Date().toISOString().slice(0, 10);

            // Filter items with endDate >= today and category == 抽選・応募 or general items
            const upcoming = contents.filter(item => item.endDate >= today).sort((a, b) => new Date(a.endDate) - new Date(b.endDate));

            if (upcoming.length === 0) {
                container.innerHTML = `<div class="py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200"><p>直近の締め切り・予定はありません</p></div>`;
                return;
            }

            container.innerHTML = upcoming.map(item => `
                <div onclick="openDetailModal('${item.id}')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-pink-300 transition-all">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-2xl bg-pink-50 text-pink-600 flex flex-col items-center justify-center font-bold text-xs shrink-0">
                            <span>締切</span>
                            <span class="text-sm">${item.endDate.slice(8, 10)}日</span>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2 mb-0.5">
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${getCategoryColor(item.category)}">${item.category}</span>
                                <span class="text-xs text-slate-400">${item.endDate} まで</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm">${item.title}</h4>
                        </div>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-lg border ${getStatusColor(item.status)}">${item.status}</span>
                </div>
            `).join('');
        }

        // Modal Controls
        function openModal(id = null) {
            document.getElementById('content-modal').classList.remove('hidden');
            if (id) {
                const item = contents.find(c => c.id === id);
                document.getElementById('modal-title').innerText = 'コンテンツ編集';
                document.getElementById('item-id').value = item.id;
                document.getElementById('item-title').value = item.title;
                document.getElementById('item-category').value = item.category;
                document.getElementById('item-member').value = item.member || '';
                document.getElementById('item-start-date').value = item.startDate;
                document.getElementById('item-end-date').value = item.endDate;
                document.getElementById('item-status').value = item.status;
                document.getElementById('item-url').value = item.url || '';
                document.getElementById('item-memo').value = item.memo || '';
            } else {
                document.getElementById('modal-title').innerText = '新規コンテンツ追加';
                document.getElementById('content-form').reset();
                document.getElementById('item-id').value = '';
                const today = new Date().toISOString().slice(0, 10);
                document.getElementById('item-start-date').value = today;
                document.getElementById('item-end-date').value = today;
            }
        }

        function closeModal() {
            document.getElementById('content-modal').classList.add('hidden');
        }

        // Save Content
        function saveContent(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const newItem = {
                id: id || Date.now().toString(),
                title: document.getElementById('item-title').value,
                category: document.getElementById('item-category').value,
                member: document.getElementById('item-member').value,
                startDate: document.getElementById('item-start-date').value,
                endDate: document.getElementById('item-end-date').value,
                status: document.getElementById('item-status').value,
                url: document.getElementById('item-url').value,
                memo: document.getElementById('item-memo').value,
                createdAt: id ? contents.find(c => c.id === id).createdAt : new Date().toISOString()
            };

            if (id) {
                const index = contents.findIndex(c => c.id === id);
                contents[index] = newItem;
            } else {
                contents.push(newItem);
            }

            saveData();
            closeModal();
            closeDetailModal();
            if (currentTab === 'list') renderList();
            if (currentTab === 'calendar') renderCalendar();
            if (currentTab === 'deadlines') renderDeadlines();
        }

        // Detail Modal Controls
        function openDetailModal(id) {
            const item = contents.find(c => c.id === id);
            if (!item) return;

            document.getElementById('detail-category-badge').innerText = item.category;
            document.getElementById('detail-category-badge').className = `px-2.5 py-1 rounded-lg text-xs font-bold border ${getCategoryColor(item.category)}`;
            
            document.getElementById('detail-status-badge').innerText = item.status;
            document.getElementById('detail-status-badge').className = `px-2.5 py-1 rounded-lg text-xs font-bold border ${getStatusColor(item.status)}`;

            document.getElementById('detail-title').innerText = item.title;
            document.getElementById('detail-member-text').innerText = item.member || '未設定';
            document.getElementById('detail-dates').innerText = item.startDate + (item.startDate !== item.endDate ? ` ～ ${item.endDate}` : '');
            
            const urlContainer = document.getElementById('detail-url-container');
            const urlLink = document.getElementById('detail-url-link');
            if (item.url) {
                urlContainer.classList.remove('hidden');
                urlLink.href = item.url;
                urlLink.querySelector('span').innerText = item.url;
            } else {
                urlContainer.classList.add('hidden');
            }

            document.getElementById('detail-memo').innerText = item.memo || 'メモはありません';
            document.getElementById('detail-gcal-btn').href = getGoogleCalendarUrl(item);

            document.getElementById('detail-edit-btn').onclick = () => { closeDetailModal(); openModal(item.id); };
            document.getElementById('detail-delete-btn').onclick = () => { deleteContent(item.id); };

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function deleteContent(id) {
            if (confirm('このコンテンツを削除してもよろしいですか？')) {
                contents = contents.filter(c => c.id !== id);
                saveData();
                closeDetailModal();
                if (currentTab === 'list') renderList();
                if (currentTab === 'calendar') renderCalendar();
                if (currentTab === 'deadlines') renderDeadlines();
            }
        }

        // Routine Modals
        function openRoutineModal() {
            document.getElementById('routine-modal').classList.remove('hidden');
        }
        function closeRoutineModal() {
            document.getElementById('routine-modal').classList.add('hidden');
        }
        function saveRoutine(e) {
            e.preventDefault();
            const newRoutine = {
                id: Date.now().toString(),
                title: document.getElementById('routine-title').value,
                day: parseInt(document.getElementById('routine-day').value),
                time: document.getElementById('routine-time').value,
                category: document.getElementById('routine-category').value
            };
            routines.push(newRoutine);
            saveData();
            closeRoutineModal();
            renderRoutineList();
        }
        function deleteRoutine(id) {
            routines = routines.filter(r => r.id !== id);
            saveData();
            renderRoutineList();
        }

        // Initial Render
        renderList();
    </script>
</body>
</html>
