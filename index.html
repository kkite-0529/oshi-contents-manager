<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コンテンツ管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white font-bold text-xl shadow-md">
                    ✨
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">コンテンツ管理</h1>
                    <p class="text-xs text-slate-500">推し活 Schedule & Completion Manager</p>
                </div>
            </div>
            <button onclick="openModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:shadow transition flex items-center space-x-2">
                <i class="fa-solid fa-plus font-bold"></i>
                <span class="hidden sm:inline">新規登録</span>
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="max-w-6xl mx-auto px-2 flex space-x-1 border-t border-slate-100 overflow-x-auto hide-scrollbar">
            <button onclick="switchTab('list')" id="tab-list" class="nav-tab px-4 py-2.5 text-sm font-medium border-b-2 border-sky-600 text-sky-600 whitespace-nowrap flex items-center space-x-2 transition">
                <span>📋</span> <span>リスト一覧</span>
            </button>
            <button onclick="switchTab('month')" id="tab-month" class="nav-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center space-x-2 transition">
                <span>📅</span> <span>月表示カレンダー</span>
            </button>
            <button onclick="switchTab('week')" id="tab-week" class="nav-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center space-x-2 transition">
                <span>🗓️</span> <span>週表示カレンダー</span>
            </button>
            <button onclick="switchTab('deadline')" id="tab-deadline" class="nav-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center space-x-2 transition">
                <span>⏰</span> <span>締め切り一覧</span>
            </button>
        </div>
    </header>

    <!-- Global Controls Bar (Filters & Search) -->
    <section class="bg-white border-b border-slate-200 px-4 py-3 shadow-2xs">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- Filter Options Left -->
            <div class="flex flex-wrap items-center gap-2">
                <!-- Incomplete Only Toggle Button (DEFAULT: ON) -->
                <button id="incomplete-filter-btn" onclick="toggleIncompleteFilter()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition border bg-amber-50 text-amber-700 border-amber-300 shadow-2xs">
                    <i id="incomplete-filter-icon" class="fa-solid fa-square-check"></i>
                    <span>未対応のみ</span>
                </button>

                <!-- Category Filter -->
                <select id="category-filter" onchange="renderCurrentView()" class="bg-slate-100 border border-slate-200 rounded-lg text-xs px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-700">
                    <option value="ALL">全てのカテゴリ</option>
                    <option value="テレビ">📺 テレビ</option>
                    <option value="ラジオ">📻 ラジオ</option>
                    <option value="Web動画">▶️ Web動画</option>
                    <option value="雑誌">📖 雑誌</option>
                    <option value="イベント">🎤 イベント</option>
                    <option value="抽選・応募">🎯 抽選・応募</option>
                    <option value="その他">📌 その他</option>
                </select>

                <!-- Member Tag Filter -->
                <select id="tag-filter" onchange="renderCurrentView()" class="bg-slate-100 border border-slate-200 rounded-lg text-xs px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-700">
                    <option value="ALL">全てのメンバー</option>
                </select>
            </div>

            <!-- Search Right -->
            <div class="relative w-full sm:w-auto sm:min-w-[200px]">
                <input type="text" id="search-input" oninput="renderCurrentView()" placeholder="タイトル・メモを検索..." class="w-full bg-slate-100 border border-slate-200 rounded-lg text-xs pl-8 pr-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-xs text-slate-400"></i>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="max-w-6xl w-full mx-auto p-4 flex-grow">
        <!-- View: List -->
        <div id="view-list" class="view-panel space-y-3"></div>

        <!-- View: Month Calendar -->
        <div id="view-month" class="view-panel hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
            <div class="flex items-center justify-between mb-4">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="month-title" class="text-base font-bold text-slate-800"></h2>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid text-center font-bold text-xs text-slate-400 mb-2">
                <div class="text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-sky-500">土</div>
            </div>
            <div id="month-grid" class="calendar-grid border-t border-l border-slate-100 text-xs"></div>
        </div>

        <!-- View: Week Calendar -->
        <div id="view-week" class="view-panel hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
            <div class="flex items-center justify-between mb-4">
                <button onclick="changeWeek(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="week-title" class="text-base font-bold text-slate-800"></h2>
                <button onclick="changeWeek(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div id="week-grid" class="grid grid-cols-1 md:grid-cols-7 gap-3"></div>
        </div>

        <!-- View: Deadlines -->
        <div id="view-deadline" class="view-panel hidden space-y-3"></div>
    </main>

    <!-- Modal Form (Add / Edit) -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">新規コンテンツ登録</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="item-form" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="form-id">

                <!-- Title (Mandatory) -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">タイトル・名前 <span class="text-red-500">*</span></label>
                    <input type="text" id="form-title" required placeholder="例: 乃木坂工事中, 雑誌〇〇 5月号" class="w-full bg-slate-50 border border-slate-200 rounded-xl text-sm px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                </div>

                <!-- Category & Member Tag -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">カテゴリ</label>
                        <select id="form-category" onchange="toggleCategoryFields()" class="w-full bg-slate-50 border border-slate-200 rounded-xl text-sm px-3 py-2 focus:ring-2 focus:ring-sky-500 outline-none">
                            <option value="テレビ">📺 テレビ</option>
                            <option value="ラジオ">📻 ラジオ</option>
                            <option value="Web動画">▶️ Web動画</option>
                            <option value="雑誌">📖 雑誌</option>
                            <option value="イベント">🎤 イベント</option>
                            <option value="抽選・応募">🎯 抽選・応募</option>
                            <option value="その他">📌 その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">出演メンバー (カンマまたはスペース区切り)</label>
                        <input type="text" id="form-tags" placeholder="例: #弓木奈於 #山下美月" class="w-full bg-slate-50 border border-slate-200 rounded-xl text-sm px-3 py-2 focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                </div>

                <!-- Standard Date Times -->
                <div id="standard-datetime-fields" class="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p class="text-xs font-bold text-slate-600">日時設定 (任意)</p>
                    
                    <!-- Start Date & Time -->
                    <div class="space-y-1">
                        <label class="text-xs text-slate-500">開始 (放送日・公開日・発売日)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="date" id="form-start-date" class="col-span-1 bg-white border border-slate-200 rounded-lg text-xs px-2 py-1.5">
                            <select id="form-start-hour" class="bg-white border border-slate-200 rounded-lg text-xs px-1 py-1.5"></select>
                            <select id="form-start-min" class="bg-white border border-slate-200 rounded-lg text-xs px-1 py-1.5"></select>
                        </div>
                    </div>

                    <!-- End Date & Time -->
                    <div class="space-y-1">
                        <label class="text-xs text-slate-500">終了 (番組終了・配信終了・締め切り)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="date" id="form-end-date" class="col-span-1 bg-white border border-slate-200 rounded-lg text-xs px-2 py-1.5">
                            <select id="form-end-hour" class="bg-white border border-slate-200 rounded-lg text-xs px-1 py-1.5"></select>
                            <select id="form-end-min" class="bg-white border border-slate-200 rounded-lg text-xs px-1 py-1.5"></select>
                        </div>
                    </div>
                </div>

                <!-- Deadline Checkbox -->
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="form-is-deadline" class="w-4 h-4 text-sky-600 rounded border-slate-300 focus:ring-sky-500">
                    <label for="form-is-deadline" class="text-xs font-bold text-slate-700">⚠️ 締め切りとして登録 (締め切り一覧に強調表示)</label>
                </div>

                <!-- Lottery Specific Fields -->
                <div id="lottery-fields" class="hidden space-y-3 bg-emerald-50/60 p-3 rounded-xl border border-emerald-100">
                    <p class="text-xs font-bold text-emerald-800">🎯 抽選・応募専用設定</p>
                    <div>
                        <label class="text-xs text-slate-600 block mb-1">応募開始日時</label>
                        <input type="datetime-local" id="form-apply-start" class="w-full bg-white border border-slate-200 rounded-lg text-xs p-2">
                    </div>
                    <div>
                        <label class="text-xs text-slate-600 block mb-1">応募締め切り日時</label>
                        <input type="datetime-local" id="form-apply-deadline" class="w-full bg-white border border-slate-200 rounded-lg text-xs p-2">
                    </div>
                    <div>
                        <label class="text-xs text-slate-600 block mb-1">当落発表日時</label>
                        <input type="datetime-local" id="form-apply-result" class="w-full bg-white border border-slate-200 rounded-lg text-xs p-2">
                    </div>
                </div>

                <!-- External URL -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">外部リンク URL (TVer, radiko, 公式サイトなど)</label>
                    <input type="url" id="form-url" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-xl text-sm px-3 py-2 focus:ring-2 focus:ring-sky-500 outline-none">
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">メモ・タイムスタンプ・感想</label>
                    <textarea id="form-notes" rows="3" placeholder="例: 14:20〜 トーク見どころ, 応募番号 #123456" class="w-full bg-slate-50 border border-slate-200 rounded-xl text-sm px-3 py-2 focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
                </div>

                <!-- Modal Actions -->
                <div class="flex items-center justify-end space-x-2 border-t border-slate-100 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100">キャンセル</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-semibold bg-sky-600 hover:bg-sky-700 text-white shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Data State
        let items = [
            {
                id: '1',
                title: '乃木坂工事中放送',
                category: 'テレビ',
                tags: ['#弓木奈於', '#乃木坂46'],
                startDate: '2026-10-18',
                startHour: '00',
                startMin: '00',
                endDate: '2026-10-18',
                endHour: '00',
                endMin: '30',
                status: '未視聴',
                isDeadline: false,
                url: 'https://tver.jp',
                notes: '見逃し配信チェック必須'
            },
            {
                id: '2',
                title: '沈黙の金曜日 (FM FUJI)',
                category: 'ラジオ',
                tags: ['#弓木奈於'],
                startDate: '2026-10-23',
                startHour: '21',
                startMin: '00',
                endDate: '2026-10-23',
                endHour: '23',
                endMin: '00',
                status: '未視聴',
                isDeadline: false,
                url: 'https://radiko.jp',
                notes: 'タイムシフトで回収予定'
            },
            {
                id: '3',
                title: '秋の全国ツアーチケット1次抽選応募',
                category: '抽選・応募',
                tags: ['#乃木坂46'],
                startDate: '',
                startHour: '',
                startMin: '',
                endDate: '',
                endHour: '',
                endMin: '',
                applyStart: '2026-10-19T10:00',
                applyDeadline: '2026-10-25T23:59',
                applyResult: '2026-10-28T15:00',
                status: '未応募',
                isDeadline: true,
                url: 'https://eplus.jp',
                notes: '千秋楽公演狙い'
            },
            {
                id: '4',
                title: 'アイドル誌 11月号特集インタビュー',
                category: '雑誌',
                tags: ['#弓木奈於'],
                startDate: '2026-10-22',
                startHour: '',
                startMin: '',
                endDate: '',
                endHour: '',
                endMin: '',
                status: '未購入',
                isDeadline: false,
                url: '',
                notes: '巻頭グラビア8ページ掲載'
            }
        ];

        let currentTab = 'list';
        let showIncompleteOnly = true; // Default ON
        let currentDate = new Date(2026, 9, 17); // Fixed context date: Oct 17, 2026

        // Category Colors Setup
        const categoryMeta = {
            'テレビ': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', barBg: 'bg-blue-500' },
            'ラジオ': { bg: 'bg-green-50', text: 'text-green-700', border: 'border-green-200', barBg: 'bg-green-500' },
            'Web動画': { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', barBg: 'bg-purple-500' },
            '雑誌': { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', barBg: 'bg-orange-500' },
            'イベント': { bg: 'bg-pink-50', text: 'text-pink-700', border: 'border-pink-200', barBg: 'bg-pink-500' },
            '抽選・応募': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', barBg: 'bg-emerald-500' },
            'その他': { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200', barBg: 'bg-slate-500' }
        };

        // Status Options per Category
        const categoryStatuses = {
            'テレビ': ['未視聴', '録画済', '視聴済', '保存完了'],
            'ラジオ': ['未視聴', '録画済', '視聴済', '保存完了'],
            'Web動画': ['未視聴', '録画済', '視聴済', '保存完了'],
            '雑誌': ['未購入', '予約済', '購入済', '読了'],
            'イベント': ['未参加', 'チケット確保', '参加完了'],
            '抽選・応募': ['未応募', '応募完了', '当落待ち', '当選', '落選'],
            'その他': ['未対応', '進行中', '完了']
        };

        const completedStatuses = ['視聴済', '保存完了', '読了', '参加完了', '当選', '落選', '完了'];

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            populateHourMinDropdowns();
            populateTagFilterOptions();
            renderCurrentView();
        });

        // Dropdown Builders
        function populateHourMinDropdowns() {
            const startHour = document.getElementById('form-start-hour');
            const endHour = document.getElementById('form-end-hour');
            const startMin = document.getElementById('form-start-min');
            const endMin = document.getElementById('form-end-min');

            startHour.innerHTML = '<option value="">時</option>';
            endHour.innerHTML = '<option value="">時</option>';
            startMin.innerHTML = '<option value="">分</option>';
            endMin.innerHTML = '<option value="">分</option>';

            for (let i = 0; i < 24; i++) {
                const val = String(i).padStart(2, '0');
                startHour.innerHTML += `<option value="${val}">${val}時</option>`;
                endHour.innerHTML += `<option value="${val}">${val}時</option>`;
            }
            for (let i = 0; i < 60; i++) {
                const val = String(i).padStart(2, '0');
                startMin.innerHTML += `<option value="${val}">${val}分</option>`;
                endMin.innerHTML += `<option value="${val}">${val}分</option>`;
            }
        }

        function populateTagFilterOptions() {
            const tagSelect = document.getElementById('tag-filter');
            const tagsSet = new Set();
            items.forEach(item => (item.tags || []).forEach(t => tagsSet.add(t)));
            
            tagSelect.innerHTML = '<option value="ALL">全てのメンバー</option>';
            tagsSet.forEach(tag => {
                tagSelect.innerHTML += `<option value="${tag}">${tag}</option>`;
            });
        }

        // Filter Toggle
        function toggleIncompleteFilter() {
            showIncompleteOnly = !showIncompleteOnly;
            const btn = document.getElementById('incomplete-filter-btn');
            const icon = document.getElementById('incomplete-filter-icon');

            if (showIncompleteOnly) {
                btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition border bg-amber-50 text-amber-700 border-amber-300 shadow-2xs";
                icon.className = "fa-solid fa-square-check";
            } else {
                btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition border bg-slate-100 text-slate-600 border-slate-200";
                icon.className = "fa-regular fa-square";
            }
            renderCurrentView();
        }

        // Filter Logic
        function getFilteredItems() {
            const cat = document.getElementById('category-filter').value;
            const tag = document.getElementById('tag-filter').value;
            const query = document.getElementById('search-input').value.toLowerCase();

            return items.filter(item => {
                if (showIncompleteOnly && completedStatuses.includes(item.status)) return false;
                if (cat !== 'ALL' && item.category !== cat) return false;
                if (tag !== 'ALL' && !(item.tags || []).includes(tag)) return false;
                if (query) {
                    const matchTitle = item.title.toLowerCase().includes(query);
                    const matchNotes = (item.notes || '').toLowerCase().includes(query);
                    if (!matchTitle && !matchNotes) return false;
                }
                return true;
            });
        }

        // View Switcher
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-tab').forEach(el => {
                el.className = "nav-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center space-x-2 transition";
            });
            document.getElementById(`tab-${tab}`).className = "nav-tab px-4 py-2.5 text-sm font-medium border-b-2 border-sky-600 text-sky-600 whitespace-nowrap flex items-center space-x-2 transition";

            document.querySelectorAll('.view-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');

            renderCurrentView();
        }

        function renderCurrentView() {
            if (currentTab === 'list') renderListView();
            else if (currentTab === 'month') renderMonthView();
            else if (currentTab === 'week') renderWeekView();
            else if (currentTab === 'deadline') renderDeadlineView();
        }

        // Status Toggle Action
        function cycleStatus(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const list = categoryStatuses[item.category] || categoryStatuses['その他'];
            const currentIndex = list.indexOf(item.status);
            const nextIndex = (currentIndex + 1) % list.length;
            item.status = list[nextIndex];

            renderCurrentView();
        }

        // Google Calendar Link Builder
        function getGoogleCalendarUrl(item) {
            const title = encodeURIComponent(item.title);
            const details = encodeURIComponent(`${item.notes || ''}\nURL: ${item.url || ''}`);
            let datesStr = '';

            if (item.category === '抽選・応募' && item.applyDeadline) {
                const deadline = new Date(item.applyDeadline);
                const iso = deadline.toISOString().replace(/-|:|\.\d\d\d/g, '');
                datesStr = `${iso}/${iso}`;
            } else if (item.startDate) {
                const sDate = item.startDate.replace(/-/g, '');
                const sTime = (item.startHour && item.startMin) ? `T${item.startHour}${item.startMin}00` : '';
                const eDate = item.endDate ? item.endDate.replace(/-/g, '') : sDate;
                const eTime = (item.endHour && item.endMin) ? `T${item.endHour}${item.endMin}00` : '';
                datesStr = `${sDate}${sTime}/${eDate}${eTime}`;
            } else {
                return '#';
            }

            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${datesStr}`;
        }

        // Render List View
        function renderListView() {
            const container = document.getElementById('view-list');
            const data = getFilteredItems();

            if (data.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-200">表示できるコンテンツがありません</div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const meta = categoryMeta[item.category] || categoryMeta['その他'];
                const isCompleted = completedStatuses.includes(item.status);
                const gcalUrl = getGoogleCalendarUrl(item);

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200 hover:border-slate-300 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="space-y-2 flex-grow">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${meta.bg} ${meta.text} ${meta.border}">
                                    ${item.category}
                                </span>
                                ${(item.tags || []).map(t => `<span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">${t}</span>`).join('')}
                                ${item.isDeadline ? `<span class="text-xs font-bold text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded-md">⚠️ 締め切り</span>` : ''}
                            </div>

                            <h3 class="text-base font-bold ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}">${item.title}</h3>

                            <!-- Time & Details -->
                            <div class="text-xs text-slate-500 space-y-1">
                                ${item.category === '抽選・応募' ? `
                                    <div class="flex flex-wrap gap-x-4 gap-y-1">
                                        ${item.applyStart ? `<span><strong class="text-slate-700">応募開始:</strong> ${item.applyStart.replace('T', ' ')}</span>` : ''}
                                        ${item.applyDeadline ? `<span class="text-red-600 font-semibold"><strong class="text-slate-700">締め切り:</strong> ${item.applyDeadline.replace('T', ' ')}</span>` : ''}
                                        ${item.applyResult ? `<span><strong class="text-slate-700">当落発表:</strong> ${item.applyResult.replace('T', ' ')}</span>` : ''}
                                    </div>
                                ` : `
                                    <div>
                                        <span>📅 ${item.startDate || '日付指定なし'} ${item.startHour ? `${item.startHour}:${item.startMin || '00'}` : ''}</span>
                                        ${item.endDate ? ` <span>〜 ${item.endDate} ${item.endHour ? `${item.endHour}:${item.endMin || '00'}` : ''}</span>` : ''}
                                    </div>
                                `}
                                ${item.notes ? `<p class="text-slate-600 bg-slate-50 p-2 rounded-lg text-xs">${item.notes}</p>` : ''}
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center justify-between sm:justify-end gap-2 border-t sm:border-t-0 border-slate-100 pt-3 sm:pt-0">
                            <!-- Status Button -->
                            <button onclick="cycleStatus('${item.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${isCompleted ? 'bg-slate-100 text-slate-500 border-slate-200' : 'bg-sky-50 text-sky-700 border-sky-200 hover:bg-sky-100'}">
                                ${item.status} <i class="fa-solid fa-rotate text-2xs ml-1"></i>
                            </button>

                            <div class="flex items-center space-x-1">
                                ${item.url ? `<a href="${item.url}" target="_blank" class="p-2 text-slate-400 hover:text-sky-600 rounded-lg hover:bg-slate-100"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>` : ''}
                                ${gcalUrl !== '#' ? `<a href="${gcalUrl}" target="_blank" title="Googleカレンダーに追加" class="p-2 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-100"><i class="fa-solid fa-calendar-plus"></i></a>` : ''}
                                <button onclick="editItem('${item.id}')" class="p-2 text-slate-400 hover:text-slate-700 rounded-lg hover:bg-slate-100"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteItem('${item.id}')" class="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-slate-100"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Month View
        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('month-title').textContent = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const data = getFilteredItems();

            const grid = document.getElementById('month-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="bg-slate-50/50 border-r border-b border-slate-100 min-h-[90px]"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                // Collect badges for date
                let cellHtml = `<div class="bg-white border-r border-b border-slate-100 p-1 min-h-[90px] flex flex-col justify-start">
                    <span class="font-semibold text-xs text-slate-600 mb-1">${d}</span>
                    <div class="space-y-1">`;

                data.forEach(item => {
                    const meta = categoryMeta[item.category] || categoryMeta['その他'];
                    
                    if (item.category === '抽選・応募') {
                        const start = item.applyStart ? item.applyStart.split('T')[0] : null;
                        const deadline = item.applyDeadline ? item.applyDeadline.split('T')[0] : null;
                        const result = item.applyResult ? item.applyResult.split('T')[0] : null;

                        if (result === dateStr) {
                            cellHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-3xs font-bold px-1.5 py-0.5 rounded ${meta.bg} ${meta.text} border ${meta.border} truncate">【当落】${item.title}</div>`;
                        } else if (start === dateStr) {
                            cellHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-3xs font-bold px-1.5 py-0.5 rounded ${meta.bg} ${meta.text} border ${meta.border} truncate">【応募開始】${item.title}</div>`;
                        } else if (deadline === dateStr) {
                            cellHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-3xs font-bold px-1.5 py-0.5 rounded bg-red-50 text-red-700 border border-red-200 truncate">【応募締め切り】${item.title}</div>`;
                        } else if (start && deadline && dateStr > start && dateStr < deadline) {
                            cellHtml += `<div class="h-1.5 w-full ${meta.barBg} opacity-40 rounded-full" title="${item.title} (応募期間中)"></div>`;
                        }
                    } else {
                        if (item.startDate === dateStr) {
                            cellHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-3xs font-medium px-1.5 py-0.5 rounded ${meta.bg} ${meta.text} border ${meta.border} truncate">${item.title}</div>`;
                        }
                    }
                });

                cellHtml += `</div></div>`;
                grid.innerHTML += cellHtml;
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderMonthView();
        }

        // Render Week View
        function renderWeekView() {
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);

            document.getElementById('week-title').textContent = `${startOfWeek.getMonth() + 1}/${startOfWeek.getDate()} 〜 ${endOfWeek.getMonth() + 1}/${endOfWeek.getDate()}`;

            const grid = document.getElementById('week-grid');
            grid.innerHTML = '';
            const data = getFilteredItems();

            for (let i = 0; i < 7; i++) {
                const day = new Date(startOfWeek);
                day.setDate(startOfWeek.getDate() + i);
                const dateStr = day.toISOString().split('T')[0];

                let dayHtml = `
                    <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 min-h-[140px] flex flex-col">
                        <div class="text-xs font-bold text-slate-600 mb-2 border-b border-slate-200 pb-1 flex justify-between">
                            <span>${['日','月','火','水','木','金','土'][i]}</span>
                            <span>${day.getMonth() + 1}/${day.getDate()}</span>
                        </div>
                        <div class="space-y-1.5 flex-grow">
                `;

                data.forEach(item => {
                    const meta = categoryMeta[item.category] || categoryMeta['その他'];

                    if (item.category === '抽選・応募') {
                        const start = item.applyStart ? item.applyStart.split('T')[0] : null;
                        const deadline = item.applyDeadline ? item.applyDeadline.split('T')[0] : null;
                        const result = item.applyResult ? item.applyResult.split('T')[0] : null;

                        if (result === dateStr) {
                            dayHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-xs p-1.5 rounded-lg ${meta.bg} ${meta.text} border ${meta.border} font-bold">【当落】${item.title}</div>`;
                        } else if (start === dateStr) {
                            dayHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-xs p-1.5 rounded-lg ${meta.bg} ${meta.text} border ${meta.border} font-bold">【応募開始】${item.title}</div>`;
                        } else if (deadline === dateStr) {
                            dayHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-xs p-1.5 rounded-lg bg-red-50 text-red-700 border border-red-200 font-bold">【応募締め切り】${item.title}</div>`;
                        } else if (start && deadline && dateStr > start && dateStr < deadline) {
                            dayHtml += `<div class="h-2 w-full ${meta.barBg} opacity-40 rounded-full" title="${item.title}"></div>`;
                        }
                    } else {
                        if (item.startDate === dateStr) {
                            dayHtml += `<div onclick="editItem('${item.id}')" class="cursor-pointer text-xs p-1.5 rounded-lg ${meta.bg} ${meta.text} border ${meta.border} font-medium">${item.title}</div>`;
                        }
                    }
                });

                dayHtml += `</div></div>`;
                grid.innerHTML += dayHtml;
            }
        }

        function changeWeek(delta) {
            currentDate.setDate(currentDate.getDate() + (delta * 7));
            renderWeekView();
        }

        // Render Deadline View
        function renderDeadlineView() {
            const container = document.getElementById('view-deadline');
            const data = getFilteredItems().filter(i => i.isDeadline || i.category === '抽選・応募');

            if (data.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-200">現在、締め切りとして登録されている項目はありません。</div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const meta = categoryMeta[item.category] || categoryMeta['その他'];
                const isCompleted = completedStatuses.includes(item.status);

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-xs border-l-4 border-l-red-500 border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded text-xs font-bold ${meta.bg} ${meta.text}">${item.category}</span>
                                <span class="text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded">⚠️ 締め切り注意</span>
                            </div>
                            <h3 class="font-bold text-base text-slate-800">${item.title}</h3>
                            <p class="text-xs text-slate-500">
                                ${item.applyDeadline ? `締め切り日時: ${item.applyDeadline.replace('T', ' ')}` : `終了日時: ${item.endDate || '未設定'}`}
                            </p>
                        </div>
                        <button onclick="cycleStatus('${item.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border ${isCompleted ? 'bg-slate-100 text-slate-500' : 'bg-red-50 text-red-700 border-red-200'}">
                            ${item.status} <i class="fa-solid fa-rotate text-2xs ml-1"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Modal Form Handlers
        function openModal(editId = null) {
            document.getElementById('item-form').reset();
            document.getElementById('form-id').value = '';
            document.getElementById('modal-title').textContent = '新規コンテンツ登録';
            
            if (editId) {
                const item = items.find(i => i.id === editId);
                if (item) {
                    document.getElementById('form-id').value = item.id;
                    document.getElementById('form-title').value = item.title;
                    document.getElementById('form-category').value = item.category;
                    document.getElementById('form-tags').value = (item.tags || []).join(' ');
                    document.getElementById('form-start-date').value = item.startDate || '';
                    document.getElementById('form-start-hour').value = item.startHour || '';
                    document.getElementById('form-start-min').value = item.startMin || '';
                    document.getElementById('form-end-date').value = item.endDate || '';
                    document.getElementById('form-end-hour').value = item.endHour || '';
                    document.getElementById('form-end-min').value = item.endMin || '';
                    document.getElementById('form-is-deadline').checked = !!item.isDeadline;
                    document.getElementById('form-apply-start').value = item.applyStart || '';
                    document.getElementById('form-apply-deadline').value = item.applyDeadline || '';
                    document.getElementById('form-apply-result').value = item.applyResult || '';
                    document.getElementById('form-url').value = item.url || '';
                    document.getElementById('form-notes').value = item.notes || '';

                    document.getElementById('modal-title').textContent = 'コンテンツの編集';
                }
            }

            toggleCategoryFields();
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        function toggleCategoryFields() {
            const cat = document.getElementById('form-category').value;
            const lotteryFields = document.getElementById('lottery-fields');
            if (cat === '抽選・応募') {
                lotteryFields.classList.remove('hidden');
            } else {
                lotteryFields.classList.add('hidden');
            }
        }

        function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const title = document.getElementById('form-title').value;
            const category = document.getElementById('form-category').value;
            const tagsRaw = document.getElementById('form-tags').value;
            const tags = tagsRaw.split(/[\s,]+/).filter(t => t.length > 0).map(t => t.startsWith('#') ? t : `#${t}`);

            const newItem = {
                id: id || Date.now().toString(),
                title,
                category,
                tags,
                startDate: document.getElementById('form-start-date').value,
                startHour: document.getElementById('form-start-hour').value,
                startMin: document.getElementById('form-start-min').value,
                endDate: document.getElementById('form-end-date').value,
                endHour: document.getElementById('form-end-hour').value,
                endMin: document.getElementById('form-end-min').value,
                isDeadline: document.getElementById('form-is-deadline').checked,
                applyStart: document.getElementById('form-apply-start').value,
                applyDeadline: document.getElementById('form-apply-deadline').value,
                applyResult: document.getElementById('form-apply-result').value,
                url: document.getElementById('form-url').value,
                notes: document.getElementById('form-notes').value,
                status: id ? (items.find(i => i.id === id)?.status || '未視聴') : (categoryStatuses[category]?.[0] || '未対応')
            };

            if (id) {
                const idx = items.findIndex(i => i.id === id);
                if (idx !== -1) items[idx] = newItem;
            } else {
                items.unshift(newItem);
            }

            populateTagFilterOptions();
            closeModal();
            renderCurrentView();
        }

        function editItem(id) {
            openModal(id);
        }

        function deleteItem(id) {
            if (confirm('このコンテンツを削除しますか？')) {
                items = items.filter(i => i.id !== id);
                populateTagFilterOptions();
                renderCurrentView();
            }
        }
    </script>
</body>
</html>
