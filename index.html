<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コンテンツ管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f8fafc', 100: '#f1f5f9', 600: '#475569', 700: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .category-badge-tv { background-color: #dbeafe; color: #1d4ed8; }
        .category-badge-radio { background-color: #dcfce7; color: #15803d; }
        .category-badge-web { background-color: #f3e8ff; color: #7e22ce; }
        .category-badge-magazine { background-color: #ffedd5; color: #c2410c; }
        .category-badge-live { background-color: #ffe4e6; color: #e11d48; }
        .category-badge-event { background-color: #fce7f3; color: #be185d; }
        .category-badge-lottery { background-color: #ccfbf1; color: #0f766e; }
        .category-badge-other { background-color: #f1f5f9; color: #475569; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-clapperboard text-indigo-600"></i> コンテンツ管理
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="openModal()" class="bg-indigo-600 text-white px-3.5 py-1.5 rounded-full text-sm font-medium hover:bg-indigo-700 shadow-sm transition active:scale-95">
                    <i class="fa-solid fa-plus mr-1"></i> 新規・定例追加
                </button>
            </div>
        </div>
        <!-- ナビゲーションタブ -->
        <div class="max-w-2xl mx-auto px-4 flex border-t border-slate-100 overflow-x-auto">
            <button onclick="switchView('list')" id="nav-list" class="flex-1 py-2.5 text-xs font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap px-3">
                <i class="fa-solid fa-list-ul mr-1"></i> リスト一覧
            </button>
            <button onclick="switchView('month')" id="nav-month" class="flex-1 py-2.5 text-xs font-semibold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap px-3">
                <i class="fa-solid fa-calendar-days mr-1"></i> 月別カレンダー
            </button>
            <button onclick="switchView('week')" id="nav-week" class="flex-1 py-2.5 text-xs font-semibold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap px-3">
                <i class="fa-solid fa-calendar-week mr-1"></i> 週別カレンダー
            </button>
            <button onclick="switchView('deadline')" id="nav-deadline" class="flex-1 py-2.5 text-xs font-semibold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap px-3">
                <i class="fa-solid fa-clock mr-1"></i> 締め切り一覧
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-2xl mx-auto px-4 py-4">
        
        <!-- コントロールバー（フィルター＆未対応のみボタン） -->
        <div class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-4 flex flex-col gap-3">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5">
                    <button id="uncompleted-btn" onclick="toggleUncompletedFilter()" class="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 shadow-xs">
                        <i class="fa-solid fa-check-square"></i> 未対応のみ表示 (ON)
                    </button>
                </div>
                <div class="text-xs text-slate-500" id="total-count">0件表示</div>
            </div>
            
            <div class="flex flex-wrap gap-2 pt-1 border-t border-slate-100">
                <select id="filter-category" onchange="renderApp()" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 outline-none focus:border-indigo-500">
                    <option value="">全カテゴリ</option>
                    <option value="tv">テレビ</option>
                    <option value="radio">ラジオ</option>
                    <option value="web">Web動画</option>
                    <option value="magazine">雑誌</option>
                    <option value="live">ライブ</option>
                    <option value="event">イベント</option>
                    <option value="lottery">抽選・応募</option>
                    <option value="other">その他</option>
                </select>
                <input type="text" id="filter-keyword" oninput="renderApp()" placeholder="キーワード検索..." class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 flex-1 text-slate-700 outline-none focus:border-indigo-500">
            </div>
        </div>

        <!-- 各ビューのコンテナ -->
        <div id="view-container"></div>
    </main>

    <!-- 登録・編集モーダル -->
    <div id="item-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl border border-slate-100">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
                <h2 id="modal-title" class="font-bold text-slate-800 text-base">新規コンテンツ追加</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <!-- 登録モード切り替えタブ -->
            <div id="registration-mode-tabs" class="flex border-b border-slate-100 bg-slate-50 px-4 pt-2 gap-2">
                <button type="button" onclick="switchRegMode('single')" id="reg-tab-single" class="px-4 py-2 text-xs font-semibold bg-white border-t border-x border-slate-200 rounded-t-lg text-indigo-600">通常登録</button>
                <button type="button" onclick="switchRegMode('series')" id="reg-tab-series" class="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-700">定例一括登録（毎週・毎月）</button>
            </div>

            <form id="item-form" onsubmit="saveItem(event)" class="p-4 space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-series-id">

                <!-- タイトル -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">タイトル・名前 <span class="text-rose-500">*</span></label>
                    <input type="text" id="form-title" required placeholder="例: 乃木坂工事中 / 沈黙の金曜日" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none focus:border-indigo-500 focus:bg-white">
                </div>

                <!-- カテゴリ -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">カテゴリ</label>
                    <select id="form-category" onchange="toggleCategoryFields()" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none focus:border-indigo-500 focus:bg-white">
                        <option value="tv">📺 テレビ</option>
                        <option value="radio">📻 ラジオ</option>
                        <option value="web">▶️ Web動画</option>
                        <option value="magazine">📖 雑誌</option>
                        <option value="live">🎤 ライブ</option>
                        <option value="event">🎤 イベント</option>
                        <option value="lottery">🎯 抽選・応募</option>
                        <option value="other">📌 その他</option>
                    </select>
                </div>

                <!-- 出演メンバー -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">出演メンバー・タグ</label>
                    <input type="text" id="form-members" placeholder="例: #弓木奈於" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none focus:border-indigo-500 focus:bg-white">
                </div>

                <!-- 通常登録用：開始＆終了日時 -->
                <div id="section-single-dates" class="space-y-3 pt-2 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">開始日時 (任意)</label>
                        <div class="flex gap-2">
                            <input type="date" id="form-start-date" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none flex-1">
                            <select id="form-start-hour" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-slate-800 outline-none"><option value="">時</option></select>
                            <select id="form-start-minute" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-slate-800 outline-none"><option value="">分</option></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">終了日時 (任意)</label>
                        <div class="flex gap-2">
                            <input type="date" id="form-end-date" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none flex-1">
                            <select id="form-end-hour" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-slate-800 outline-none"><option value="">時</option></select>
                            <select id="form-end-minute" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-slate-800 outline-none"><option value="">分</option></select>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="form-is-deadline" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                        <label for="form-is-deadline" class="text-xs font-semibold text-slate-700">⚠️ 締め切りとして登録（締め切り一覧に抽出）</label>
                    </div>
                </div>

                <!-- 定例一括登録用フィールド（新規時のみ） -->
                <div id="section-series-options" class="space-y-3 pt-2 border-t border-slate-100 hidden">
                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-xs text-indigo-900 space-y-2">
                        <font class="font-bold">定例一括生成設定</font>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-semibold mb-1">繰り返し頻度</label>
                                <select id="series-freq" class="w-full text-xs bg-white border border-indigo-200 rounded-lg p-1.5">
                                    <option value="weekly">毎週 (曜日指定)</option>
                                    <option value="monthly">毎月 (日付指定)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold mb-1">対象曜日 / 日付</label>
                                <select id="series-day" class="w-full text-xs bg-white border border-indigo-200 rounded-lg p-1.5">
                                    <option value="1">毎週月曜日</option>
                                    <option value="2">毎週火曜日</option>
                                    <option value="3">毎週水曜日</option>
                                    <option value="4">毎週木曜日</option>
                                    <option value="5">毎週金曜日</option>
                                    <option value="6">毎週土曜日</option>
                                    <option value="0">毎週日曜日</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <div>
                                <label class="block font-semibold mb-1">開始日</label>
                                <input type="date" id="series-start-date" class="w-full text-xs bg-white border border-indigo-200 rounded-lg p-1.5">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1">生成回数</label>
                                <input type="number" id="series-count" value="4" min="1" max="52" class="w-full text-xs bg-white border border-indigo-200 rounded-lg p-1.5">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 抽選・応募専用フィールド -->
                <div id="section-lottery-fields" class="space-y-3 pt-2 border-t border-slate-100 hidden bg-emerald-50/50 p-3 rounded-xl border border-emerald-100">
                    <div class="text-xs font-bold text-emerald-800 flex items-center gap-1"><i class="fa-solid fa-ticket"></i> 抽選・応募スケジュール詳細</div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">応募開始日時</label>
                        <input type="datetime-local" id="form-apply-start" class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">応募締め切り日時</label>
                        <input type="datetime-local" id="form-apply-deadline" class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">当落発表日時</label>
                        <input type="datetime-local" id="form-result-date" class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none">
                    </div>
                </div>

                <!-- リンクURL -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">外部リンクURL (TVer, 応募フォーム等)</label>
                    <input type="url" id="form-url" placeholder="https://..." class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none focus:border-indigo-500 focus:bg-white">
                </div>

                <!-- メモ -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">メモ・感想・タイムスタンプ</label>
                    <textarea id="form-memo" rows="2" placeholder="例: 15:20〜のトークが最高だった" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none focus:border-indigo-500 focus:bg-white"></textarea>
                </div>

                <!-- 保存ボタン -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-indigo-700 shadow-sm transition">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- シリーズ一括/個別編集確認モーダル -->
    <div id="series-edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl border border-slate-100 text-center space-y-4">
            <div class="text-indigo-600 text-3xl"><i class="fa-solid fa-layer-group"></i></div>
            <h3 class="font-bold text-slate-800 text-base">定例シリーズの編集</h3>
            <p class="text-xs text-slate-600">このアイテムは定例シリーズに含まれています。どのように変更しますか？</p>
            <div class="space-y-2 pt-2">
                <button onclick="confirmSeriesEdit('single')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs py-2.5 rounded-xl font-medium transition">
                    この予定のみ個別編集する
                </button>
                <button onclick="confirmSeriesEdit('all')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-2.5 rounded-xl font-medium transition">
                    シリーズ全体を一括更新する
                </button>
                <button onclick="closeSeriesEditModal()" class="w-full text-slate-400 hover:text-slate-600 text-xs py-2">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

    <script>
        // アプリの状態
        let currentView = 'list';
        let filterUncompletedOnly = true;
        let regMode = 'single'; // 'single' or 'series'
        let pendingItemData = null;

        // カテゴリ定義
        const categoryMeta = {
            tv: { label: 'テレビ', badge: 'category-badge-tv', icon: 'fa-tv' },
            radio: { label: 'ラジオ', badge: 'category-badge-radio', icon: 'fa-headphones' },
            web: { label: 'Web動画', badge: 'category-badge-web', icon: 'fa-video' },
            magazine: { label: '雑誌', badge: 'category-badge-magazine', icon: 'fa-book-open' },
            live: { label: 'ライブ', badge: 'category-badge-live', icon: 'fa-microphone-lines' },
            event: { label: 'イベント', badge: 'category-badge-event', icon: 'fa-calendar-star' },
            lottery: { label: '抽選・応募', badge: 'category-badge-lottery', icon: 'fa-ticket' },
            other: { label: 'その他', badge: 'category-badge-other', icon: 'fa-tag' }
        };

        // ステータス定義
        const statuses = {
            tv: ['未視聴', '録画済', '視聴済', '保存完了'],
            radio: ['未視聴', '録画済', '視聴済', '保存完了'],
            web: ['未視聴', 'アーカイブ視聴済', '保存完了'],
            magazine: ['未購入', '予約済', '購入済', '読了'],
            live: ['未参加', 'チケット確保済', '参加済', '映像化待ち'],
            event: ['未参加', 'チケット確保済', '参加済'],
            lottery: ['未応募', '応募完了', '当落待ち', '当選', '落選'],
            other: ['未対応', '対応完了']
        };

        // サンプルデータ
        let items = [
            {
                id: '1',
                seriesId: 'series_1',
                title: '沈黙の金曜日',
                category: 'radio',
                members: '#弓木奈於',
                startDate: '2026-10-23', startHour: '21', startMinute: '00',
                endDate: '2026-10-23', endHour: '23', endMinute: '00',
                isDeadline: false,
                status: '未視聴',
                url: 'https://radiko.jp/',
                memo: '金曜夜の生放送！'
            },
            {
                id: '2',
                title: '乃木坂工事中',
                category: 'tv',
                members: '#弓木奈於',
                startDate: '2026-10-25', startHour: '00', startMinute: '00',
                endDate: '2026-10-25', endHour: '00', endMinute: '30',
                isDeadline: false,
                status: '録画済',
                url: '',
                memo: 'TVerチェック'
            },
            {
                id: '3',
                title: '乃木坂46 ライブチケット先行抽選',
                category: 'lottery',
                members: '#弓木奈於',
                startDate: '', startHour: '', startMinute: '',
                endDate: '', endHour: '', endMinute: '',
                isDeadline: true,
                applyStart: '2026-10-20T12:00',
                applyDeadline: '2026-10-28T23:59',
                resultDate: '2026-11-02T15:00',
                status: '未応募',
                url: 'https://example.com',
                memo: '忘れずに応募する'
            }
        ];

        // 初期化
        window.addEventListener('DOMContentLoaded', () => {
            initSelects();
            renderApp();
        });

        function initSelects() {
            const hours = Array.from({length: 24}, (_, i) => String(i).padStart(2, '0'));
            const minutes = Array.from({length: 60}, (_, i) => String(i).padStart(2, '0'));

            ['form-start-hour', 'form-end-hour'].forEach(id => {
                const el = document.getElementById(id);
                hours.forEach(h => el.innerHTML += `<option value="${h}">${h}時</option>`);
            });
            ['form-start-minute', 'form-end-minute'].forEach(id => {
                const el = document.getElementById(id);
                minutes.forEach(m => el.innerHTML += `<option value="${m}">${m}分</option>`);
            });

            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('series-start-date').value = todayStr;
        }

        function switchView(view) {
            currentView = view;
            ['list', 'month', 'week', 'deadline'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if (v === view) {
                    btn.className = "flex-1 py-2.5 text-xs font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap px-3";
                } else {
                    btn.className = "flex-1 py-2.5 text-xs font-semibold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap px-3";
                }
            });
            renderApp();
        }

        function toggleUncompletedFilter() {
            filterUncompletedOnly = !filterUncompletedOnly;
            const btn = document.getElementById('uncompleted-btn');
            if (filterUncompletedOnly) {
                btn.className = "bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 shadow-xs";
                btn.innerHTML = '<i class="fa-solid fa-check-square"></i> 未対応のみ表示 (ON)';
            } else {
                btn.className = "bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 shadow-xs";
                btn.innerHTML = '<i class="fa-solid fa-square"></i> 未対応のみ表示 (OFF)';
            }
            renderApp();
        }

        function switchRegMode(mode) {
            regMode = mode;
            const tabSingle = document.getElementById('reg-tab-single');
            const tabSeries = document.getElementById('reg-tab-series');
            const secSingle = document.getElementById('section-single-dates');
            const secSeries = document.getElementById('section-series-options');

            if (mode === 'single') {
                tabSingle.className = "px-4 py-2 text-xs font-semibold bg-white border-t border-x border-slate-200 rounded-t-lg text-indigo-600";
                tabSeries.className = "px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-700";
                secSingle.classList.remove('hidden');
                secSeries.classList.add('hidden');
            } else {
                tabSeries.className = "px-4 py-2 text-xs font-semibold bg-white border-t border-x border-slate-200 rounded-t-lg text-indigo-600";
                tabSingle.className = "px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-700";
                secSeries.classList.remove('hidden');
                secSingle.classList.add('hidden');
            }
        }

        function toggleCategoryFields() {
            const cat = document.getElementById('form-category').value;
            const lotteryFields = document.getElementById('section-lottery-fields');
            if (cat === 'lottery') {
                lotteryFields.classList.remove('hidden');
            } else {
                lotteryFields.classList.add('hidden');
            }
        }

        // フィルター適用後のアイテム取得
        function getFilteredItems() {
            const catFilter = document.getElementById('filter-category').value;
            const kwFilter = document.getElementById('filter-keyword').value.toLowerCase();

            return items.filter(item => {
                if (catFilter && item.category !== catFilter) return false;
                if (kwFilter) {
                    const textMatch = (item.title + ' ' + item.members + ' ' + item.memo).toLowerCase().includes(kwFilter);
                    if (!textMatch) return false;
                }
                if (filterUncompletedOnly) {
                    const statusList = statuses[item.category] || [];
                    const isCompleted = item.status === statusList[statusList.length - 1] || item.status === '視聴済' || item.status === '読了・切抜き完了' || item.status === '当選' || item.status === '落選';
                    if (isCompleted) return false;
                }
                return true;
            });
        }

        // メインレンダリング
        function renderApp() {
            const container = document.getElementById('view-container');
            const filtered = getFilteredItems();
            document.getElementById('total-count').innerText = `${filtered.length}件表示`;

            if (currentView === 'list') {
                container.innerHTML = renderListView(filtered);
            } else if (currentView === 'month') {
                container.innerHTML = renderMonthCalendar();
            } else if (currentView === 'week') {
                container.innerHTML = renderWeekCalendar();
            } else if (currentView === 'deadline') {
                const deadlineFiltered = filtered.filter(i => i.isDeadline || i.applyDeadline);
                container.innerHTML = renderDeadlineView(deadlineFiltered);
            }
        }

        // リストビュー
        function renderListView(list) {
            if (list.length === 0) {
                return `<div class="bg-white rounded-2xl p-8 text-center text-slate-400 text-xs shadow-xs border border-slate-200">表示するコンテンツはありません</div>`;
            }

            return `<div class="space-y-3">${list.map(item => {
                const meta = categoryMeta[item.category] || categoryMeta.other;
                const statusList = statuses[item.category] || [];
                
                let dateStr = '';
                if (item.startDate) {
                    dateStr += `${item.startDate} ${item.startHour \vert{}\vert{} '00'}:${item.startMinute || '00'}`;
                    if (item.endDate) dateStr += ` 〜 ${item.endDate} ${item.endHour \vert{}\vert{} '00'}:${item.endMinute || '00'}`;
                } else if (item.applyDeadline) {
                    dateStr += `応募締切: ${item.applyDeadline.replace('T', ' ')}`;
                } else {
                    dateStr = '日時未設定';
                }

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200 relative overflow-hidden flex flex-col gap-2.5">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex flex-wrap items-center gap-1.5">
                                <span class="text-[10px] px-2 py-0.5 rounded-md font-semibold ${meta.badge}">
                                    <i class="fa-solid ${meta.icon} mr-1"></i>${meta.label}
                                </span>
                                ${item.members ? `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">${item.members}</span>` : ''}
                                ${item.isDeadline ? `<span class="text-[10px] bg-rose-50 text-rose-600 px-2 py-0.5 rounded-md font-bold">⚠️ 締め切り</span>` : ''}
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="openEditModal('${item.id}')" class="text-slate-400 hover:text-indigo-600 p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>

                        <div>
                            <h3 class="font-bold text-slate-800 text-sm">${item.title}</h3>
                            <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${dateStr}</div>
                        </div>

                        ${item.category === 'lottery' ? `
                            <div class="bg-emerald-50/60 p-2 rounded-xl text-[11px] text-emerald-900 grid grid-cols-2 gap-1 border border-emerald-100">
                                <div>応募開始: ${item.applyStart ? item.applyStart.replace('T', ' ') : '未定'}</div>
                                <div>当落発表: ${item.resultDate ? item.resultDate.replace('T', ' ') : '未定'}</div>
                            </div>
                        ` : ''}

                        ${item.memo ? `<div class="text-xs bg-slate-50 p-2 rounded-xl text-slate-600">${item.memo}</div>` : ''}

                        <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
                            <div class="flex flex-wrap gap-1">
                                ${statusList.map(st => `
                                    <button onclick="updateStatus('${item.id}', '${st}')" class="px-2.5 py-1 rounded-lg font-medium text-[11px] transition ${item.status === st ? 'bg-indigo-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                        ${st}
                                    </button>
                                `).join('')}
                            </div>
                            ${item.url ? `<a href="${item.url}" target="_blank" class="text-indigo-600 font-semibold hover:underline flex items-center gap-1"><i class="fa-solid fa-arrow-up-right-from-square"></i> リンク</a>` : ''}
                        </div>
                    </div>
                `;
            }).join('')}</div>`;
        }

        // 月別カレンダー
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0-11

        function renderMonthCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const startDayOfWeek = firstDay.getDay(); // 0:Sun, 1:Mon...
            const daysInMonth = lastDay.getDate();

            let html = `
                <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="changeMonth(-1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl"><i class="fa-solid fa-chevron-left"></i></button>
                        <h2 class="font-bold text-slate-800 text-sm">${currentYear}年 ${currentMonth + 1}月</h2>
                        <button onclick="changeMonth(1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-2">
                        <div class="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-indigo-500">土</div>
                    </div>

                    <div class="grid grid-cols-7 gap-1">
            `;

            for (let i = 0; i < startDayOfWeek; i++) {
                html += `<div class="h-24 bg-slate-50/50 rounded-xl border border-slate-100 opacity-30"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                // 当日のイベント抽出
                const dayItems = items.filter(item => {
                    if (item.startDate === dateStr) return true;
                    if (item.category === 'lottery' && item.applyStart && item.applyDeadline) {
                        return dateStr >= item.applyStart.split('T')[0] && dateStr <= item.applyDeadline.split('T')[0];
                    }
                    return false;
                });

                const resultItems = items.filter(item => item.category === 'lottery' && item.resultDate && item.resultDate.split('T')[0] === dateStr);

                html += `
                    <div onclick="jumpToListDate('${dateStr}')" class="h-24 bg-white rounded-xl border border-slate-100 p-1 overflow-y-auto flex flex-col gap-1 cursor-pointer hover:border-indigo-300 transition">
                        <div class="text-[11px] font-bold text-slate-700">${day}</div>
                        <div class="flex flex-col gap-0.5">
                            ${resultItems.map(item => `<div class="text-[9px] bg-emerald-600 text-white px-1 py-0.5 rounded truncate font-bold">【当落】${item.title}</div>`).join('')}
                            ${dayItems.map(item => {
                                if (item.category === 'lottery' && item.applyStart && item.applyDeadline) {
                                    const sDate = item.applyStart.split('T')[0];
                                    const eDate = item.applyDeadline.split('T')[0];
                                    if (dateStr === sDate) return `<div class="text-[9px] bg-teal-500 text-white px-1 py-0.5 rounded truncate font-bold">【応募開始】${item.title}</div>`;
                                    if (dateStr === eDate) return `<div class="text-[9px] bg-rose-500 text-white px-1 py-0.5 rounded truncate font-bold">【応募締切】${item.title}</div>`;
                                    return `<div class="h-1 bg-teal-200 rounded-full w-full my-0.5"></div>`;
                                }
                                return `<div class="text-[9px] bg-indigo-50 text-indigo-700 px-1 py-0.5 rounded truncate font-medium">${item.title}</div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            html += `</div></div>`;
            return html;
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderApp();
        }

        function jumpToListDate(dateStr) {
            document.getElementById('filter-keyword').value = dateStr;
            switchView('list');
            renderApp();
        }

        // 週別カレンダー
        let currentWeekOffset = 0;
        function renderWeekCalendar() {
            const today = new Date();
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay() + (currentWeekOffset * 7));

            let html = `
                <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="changeWeek(-1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl"><i class="fa-solid fa-chevron-left"></i></button>
                        <h2 class="font-bold text-slate-800 text-sm">週間スケジュール</h2>
                        <button onclick="changeWeek(1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <div class="space-y-2">
            `;

            for (let i = 0; i < 7; i++) {
                const targetDate = new Date(startOfWeek);
                targetDate.setDate(startOfWeek.getDate() + i);
                const dateStr = targetDate.toISOString().split('T')[0];
                const dayName = ['日', '月', '火', '水', '木', '金', '土'][i];

                const dayItems = items.filter(item => item.startDate === dateStr || (item.category === 'lottery' && item.applyStart && item.applyDeadline && dateStr >= item.applyStart.split('T')[0] && dateStr <= item.applyDeadline.split('T')[0]));

                html += `
                    <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 flex flex-col gap-1.5">
                        <div class="text-xs font-bold text-slate-700 flex items-center justify-between">
                            <span>${dateStr} (${dayName})</span>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            ${dayItems.length === 0 ? `<span class="text-[11px] text-slate-400">予定なし</span>` : dayItems.map(item => `<span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium">${item.title}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            html += `</div></div>`;
            return html;
        }

        function changeWeek(dir) {
            currentWeekOffset += dir;
            renderApp();
        }

        // 締め切り一覧
        function renderDeadlineView(list) {
            if (list.length === 0) {
                return `<div class="bg-white rounded-2xl p-8 text-center text-slate-400 text-xs shadow-xs border border-slate-200">締め切りが近いアイテムはありません</div>`;
            }
            return renderListView(list);
        }

        // モーダル操作
        function openModal() {
            document.getElementById('edit-id').value = '';
            document.getElementById('edit-series-id').value = '';
            document.getElementById('modal-title').innerText = '新規・定例コンテンツ追加';
            document.getElementById('registration-mode-tabs').classList.remove('hidden');
            document.getElementById('item-form').reset();
            switchRegMode('single');
            toggleCategoryFields();
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-series-id').value = item.seriesId || '';
            document.getElementById('modal-title').innerText = 'コンテンツ編集';
            document.getElementById('registration-mode-tabs').classList.add('hidden');
            document.getElementById('section-series-options').classList.add('hidden');
            document.getElementById('section-single-dates').classList.remove('hidden');

            document.getElementById('form-title').value = item.title;
            document.getElementById('form-category').value = item.category;
            document.getElementById('form-members').value = item.members || '';
            document.getElementById('form-start-date').value = item.startDate || '';
            document.getElementById('form-start-hour').value = item.startHour || '';
            document.getElementById('form-start-minute').value = item.startMinute || '';
            document.getElementById('form-end-date').value = item.endDate || '';
            document.getElementById('form-end-hour').value = item.endHour || '';
            document.getElementById('form-end-minute').value = item.endMinute || '';
            document.getElementById('form-is-deadline').checked = item.isDeadline || false;
            document.getElementById('form-apply-start').value = item.applyStart || '';
            document.getElementById('form-apply-deadline').value = item.applyDeadline || '';
            document.getElementById('form-result-date').value = item.resultDate || '';
            document.getElementById('form-url').value = item.url || '';
            document.getElementById('form-memo').value = item.memo || '';

            toggleCategoryFields();
            document.getElementById('item-modal').classList.remove('hidden');
        }

        // 保存処理
        function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const seriesId = document.getElementById('edit-series-id').value;

            const title = document.getElementById('form-title').value;
            const category = document.getElementById('form-category').value;
            const members = document.getElementById('form-members').value;
            const startDate = document.getElementById('form-start-date').value;
            const startHour = document.getElementById('form-start-hour').value;
            const startMinute = document.getElementById('form-start-minute').value;
            const endDate = document.getElementById('form-end-date').value;
            const endHour = document.getElementById('form-end-hour').value;
            const endMinute = document.getElementById('form-end-minute').value;
            const isDeadline = document.getElementById('form-is-deadline').checked;
            const applyStart = document.getElementById('form-apply-start').value;
            const applyDeadline = document.getElementById('form-apply-deadline').value;
            const resultDate = document.getElementById('form-result-date').value;
            const url = document.getElementById('form-url').value;
            const memo = document.getElementById('form-memo').value;

            if (id && seriesId) {
                // シリーズ編集時の確認
                pendingItemData = { id, seriesId, title, category, members, startDate, startHour, startMinute, endDate, endHour, endMinute, isDeadline, applyStart, applyDeadline, resultDate, url, memo };
                closeModal();
                document.getElementById('series-edit-modal').classList.remove('hidden');
                return;
            }

            if (regMode === 'series' && !id) {
                // 定例一括生成
                const freq = document.getElementById('series-freq').value;
                const dayOfWeek = parseInt(document.getElementById('series-day').value);
                const sDateStr = document.getElementById('series-start-date').value;
                const count = parseInt(document.getElementById('series-count').value) || 4;
                const newSeriesId = 'series_' + Date.now();

                let currDate = new Date(sDateStr || Date.now());
                for (let i = 0; i < count; i++) {
                    if (freq === 'weekly') {
                        while (currDate.getDay() !== dayOfWeek) {
                            currDate.setDate(currDate.getDate() + 1);
                        }
                    }
                    const dStr = currDate.toISOString().split('T')[0];
                    items.push({
                        id: '_' + Math.random().toString(36).substr(2, 9),
                        seriesId: newSeriesId,
                        title, category, members,
                        startDate: dStr, startHour, startMinute,
                        endDate: dStr, endHour, endMinute,
                        isDeadline, applyStart, applyDeadline, resultDate, url, memo,
                        status: (statuses[category] || [])[0] || '未視聴'
                    });
                    currDate.setDate(currDate.getDate() + 7);
                }
            } else if (id) {
                // 単一更新
                const item = items.find(i => i.id === id);
                if (item) {
                    item.title = title; item.category = category; item.members = members;
                    item.startDate = startDate; item.startHour = startHour; item.startMinute = startMinute;
                    item.endDate = endDate; item.endHour = endHour; item.endMinute = endMinute;
                    item.isDeadline = isDeadline; item.applyStart = applyStart; item.applyDeadline = applyDeadline;
                    item.resultDate = resultDate; item.url = url; item.memo = memo;
                }
            } else {
                // 単一新規
                items.push({
                    id: '_' + Math.random().toString(36).substr(2, 9),
                    title, category, members,
                    startDate, startHour, startMinute,
                    endDate, endHour, endMinute,
                    isDeadline, applyStart, applyDeadline, resultDate, url, memo,
                    status: (statuses[category] || [])[0] || '未視聴'
                });
            }

            closeModal();
            renderApp();
        }

        function confirmSeriesEdit(mode) {
            if (!pendingItemData) return;
            const data = pendingItemData;

            if (mode === 'single') {
                const item = items.find(i => i.id === data.id);
                if (item) {
                    item.seriesId = ''; // シリーズから切り離し
                    item.title = data.title; item.category = data.category; item.members = data.members;
                    item.startDate = data.startDate; item.startHour = data.startHour; item.startMinute = data.startMinute;
                    item.endDate = data.endDate; item.endHour = data.endHour; item.endMinute = data.endMinute;
                    item.isDeadline = data.isDeadline; item.applyStart = data.applyStart; item.applyDeadline = data.applyDeadline;
                    item.resultDate = data.resultDate; item.url = data.url; item.memo = data.memo;
                }
            } else {
                items.forEach(item => {
                    if (item.seriesId === data.seriesId) {
                        item.title = data.title; item.category = data.category; item.members = data.members;
                        item.isDeadline = data.isDeadline; item.url = data.url; item.memo = data.memo;
                    }
                });
            }

            pendingItemData = null;
            document.getElementById('series-edit-modal').classList.add('hidden');
            renderApp();
        }

        function closeSeriesEditModal() {
            pendingItemData = null;
            document.getElementById('series-edit-modal').classList.add('hidden');
        }

        function updateStatus(id, newStatus) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.status = newStatus;
                renderApp();
            }
        }

        function deleteItem(id) {
            if (confirm('このコンテンツを削除しますか？')) {
                items = items.filter(i => i.id !== id);
                renderApp();
            }
        }
    </script>
</body>
</html>
