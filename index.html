<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コンテンツ管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pop: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    },
                    borderRadius: {
                        'xl': '1rem',
                        '2xl': '1.25rem',
                    }
                }
            }
        }
    </script>
    <!-- Inter & Noto Sans JP Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-teal-100 selection:text-teal-900">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">推</div>
                <span class="text-xl font-bold tracking-tight text-slate-800">コンテンツ管理</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center shadow-sm whitespace-nowrap">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    新規追加
                </button>
            </div>
        </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 shadow-2xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto space-x-1 sm:space-x-4 py-2.5 scrollbar-none">
            <button onclick="switchTab('calendar')" id="tab-calendar" class="tab-btn px-4 py-2 text-sm font-bold rounded-xl text-slate-600 hover:bg-slate-100 whitespace-nowrap transition active-tab">📅 カレンダー</button>
            <button onclick="switchTab('list')" id="tab-list" class="tab-btn px-4 py-2 text-sm font-bold rounded-xl text-slate-600 hover:bg-slate-100 whitespace-nowrap transition">📋 全体一覧</button>
            <button onclick="switchTab('deadline')" id="tab-deadline" class="tab-btn px-4 py-2 text-sm font-bold rounded-xl text-slate-600 hover:bg-slate-100 whitespace-nowrap transition">⏰ 締め切り管理</button>
            <button onclick="switchTab('regular')" id="tab-regular" class="tab-btn px-4 py-2 text-sm font-bold rounded-xl text-slate-600 hover:bg-slate-100 whitespace-nowrap transition">🔄 定例管理</button>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Filters & Search Toolbar -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-2xs flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
            <div class="flex flex-wrap items-center gap-2">
                <select id="filter-category" onchange="renderCurrentView()" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                    <option value="">すべてのカテゴリ</option>
                    <option value="テレビ・配信">テレビ・配信</option>
                    <option value="ラジオ">ラジオ</option>
                    <option value="応募">応募</option>
                    <option value="購入(グッズ・雑誌など)">購入(グッズ・雑誌など)</option>
                    <option value="ライブ">ライブ</option>
                    <option value="イベント">イベント</option>
                    <option value="その他">その他</option>
                </select>
                <select id="filter-status" onchange="renderCurrentView()" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                    <option value="">すべてのステータス</option>
                    <option value="未対応">未対応</option>
                    <option value="対応済">対応済</option>
                </select>
                <label class="flex items-center space-x-2 text-sm font-medium text-slate-700 select-none px-2 py-1 bg-slate-50 rounded-xl border border-slate-200">
                    <input type="checkbox" id="filter-unhandled-only" onchange="renderCurrentView()" class="rounded text-teal-600 focus:ring-teal-500 w-4 h-4">
                    <span>未対応のみ</span>
                </label>
            </div>
            <div class="relative w-full md:w-64">
                <input type="text" id="search-keyword" oninput="renderCurrentView()" placeholder="キーワード検索..." class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- 1. Calendar Tab Container (Consolidating Month, Week, Day views) -->
        <div id="view-calendar" class="view-container space-y-4">
            <!-- Calendar Sub-Toolbar: Switcher & Navigation -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <select id="calendar-mode-select" onchange="switchCalendarMode(this.value)" class="bg-teal-50 border border-teal-200 text-teal-900 rounded-xl px-3 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="month">月別カレンダー</option>
                        <option value="week">週別カレンダー</option>
                        <option value="day">日別一覧</option>
                    </select>
                    <button onclick="jumpToCurrentDate()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap">
                        <span id="jump-btn-label">今月に戻る</span>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="changeCalendarDate(-1)" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h2 id="calendar-nav-title" class="text-base sm:text-lg font-bold text-slate-800 min-w-[180px] text-center">2026年 10月</h2>
                    <button onclick="changeCalendarDate(1)" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                <div id="calendar-extra-controls" class="w-full sm:w-auto flex justify-end">
                    <input type="date" id="day-date-picker" onchange="onDayDatePicked(this.value)" class="hidden border border-slate-300 rounded-xl px-3 py-1.5 text-sm bg-slate-50 font-medium text-slate-700">
                </div>
            </div>

            <!-- Month View Container -->
            <div id="cal-subview-month" class="cal-subview space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-2xs">
                    <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50 text-center text-xs font-bold text-slate-600 py-3">
                        <div class="text-rose-600">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div class="text-blue-600">金</div><div>土</div>
                    </div>
                    <div id="month-grid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-200 bg-slate-200 min-h-[600px]">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </div>

            <!-- Week View Container -->
            <div id="cal-subview-week" class="cal-subview hidden space-y-4">
                <div id="week-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">
                    <!-- Rendered via JS -->
                </div>
            </div>

            <!-- Day View Container -->
            <div id="cal-subview-day" class="cal-subview hidden space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs min-h-[450px]">
                    <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-100">
                        <h3 class="font-bold text-slate-800 text-base" id="day-schedule-heading">本日の予定一覧</h3>
                        <button onclick="openModalForDate(currentDayDateStr)" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center shadow-2xs whitespace-nowrap">
                            <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                            この日に予定を追加
                        </button>
                    </div>
                    <div id="day-schedule-list" class="space-y-3">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Full List View Container -->
        <div id="view-list" class="view-container hidden space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs">
                <h2 class="text-lg font-bold text-slate-800 mb-4">すべての予定一覧</h2>
                <div id="full-list-container" class="space-y-3">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>

        <!-- 3. Deadline View Container -->
        <div id="view-deadline" class="view-container hidden space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs">
                <h2 class="text-lg font-bold text-slate-800 mb-4">応募・締め切り管理</h2>
                <div id="deadline-container" class="space-y-3">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>

        <!-- 4. Regular View Container -->
        <div id="view-regular" class="view-container hidden space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800">定例コンテンツ管理</h2>
                    <button onclick="openRegularModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-2xs whitespace-nowrap">定例を追加</button>
                </div>
                <div id="regular-container" class="space-y-3">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Daily Popup Modal (When clicking a date in month/week views) -->
    <div id="day-popup-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-2xs z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                <h3 id="popup-date-title" class="text-base font-bold text-slate-800">2026年10月18日(日) の予定</h3>
                <button onclick="closeDayPopup()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="popup-schedule-list" class="overflow-y-auto flex-1 space-y-3 pr-1 mb-4">
                <!-- Rendered via JS -->
            </div>
            <div class="pt-3 border-t border-slate-100 flex justify-end">
                <button id="popup-add-btn" onclick="" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition w-full sm:w-auto shadow-sm whitespace-nowrap">
                    この日に予定を追加
                </button>
            </div>
        </div>
    </div>

    <!-- Event Detail View Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-2xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <div class="flex items-center space-x-2">
                    <span id="detail-badge-cat" class="text-xs font-bold px-2.5 py-1 rounded-xl border"></span>
                    <span id="detail-badge-status" class="text-xs font-bold px-2.5 py-1 rounded-xl"></span>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div>
                <h3 id="detail-title" class="text-lg font-bold text-slate-900 mb-1"></h3>
                <div id="detail-date-display" class="text-xs font-bold text-slate-500"></div>
            </div>
            <div id="detail-app-box" class="hidden p-3.5 bg-teal-50/60 rounded-xl border border-teal-100 text-xs space-y-1">
                <div class="font-bold text-teal-900 mb-1">応募スケジュール詳細</div>
                <div>応募開始: <span id="detail-app-start" class="font-medium text-slate-700"></span></div>
                <div class="text-rose-600 font-bold">応募締切: <span id="detail-app-deadline"></span></div>
                <div>当落発表: <span id="detail-app-result" class="font-medium text-slate-700"></span></div>
            </div>
            <div>
                <div class="text-xs font-bold text-slate-400 mb-1">メモ</div>
                <p id="detail-memo" class="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200 whitespace-pre-wrap"></p>
            </div>
            <div id="detail-link-container" class="hidden">
                <div class="text-xs font-bold text-slate-400 mb-1">関連リンク</div>
                <a id="detail-link" href="#" target="_blank" class="text-xs text-teal-600 hover:text-teal-700 font-bold underline break-all block"></a>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                <a id="detail-gcal-btn" href="#" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center whitespace-nowrap">
                    <svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg>
                    Googleカレンダー
                </a>
                <div class="flex items-center space-x-2">
                    <button id="detail-edit-btn" onclick="" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition">編集</button>
                    <button id="detail-delete-btn" onclick="" class="bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-2 rounded-xl text-xs font-bold transition">削除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Event Create/Edit Modal -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-2xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 my-8">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">新規スケジュール追加</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="event-form" onsubmit="saveEvent(event)" class="space-y-4">
                <input type="hidden" id="event-id">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="event-title" required placeholder="例: 〇〇番組出演 / ライブチケット申込" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">カテゴリ <span class="text-rose-500">*</span></label>
                        <select id="event-category" onchange="toggleCategoryFields()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                            <option value="テレビ・配信">テレビ・配信</option>
                            <option value="ラジオ">ラジオ</option>
                            <option value="応募">応募</option>
                            <option value="購入(グッズ・雑誌など)">購入(グッズ・雑誌など)</option>
                            <option value="ライブ">ライブ</option>
                            <option value="イベント">イベント</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">ステータス</label>
                        <select id="event-status" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                            <option value="未対応">未対応</option>
                            <option value="対応済">対応済</option>
                        </select>
                    </div>
                </div>

                <!-- Deadline Checkbox Feature -->
                <div id="deadline-checkbox-container" class="p-3 bg-teal-50/50 rounded-xl border border-teal-100 flex items-center space-x-2">
                    <input type="checkbox" id="event-is-deadline" class="rounded text-teal-600 focus:ring-teal-500 w-4 h-4">
                    <label for="event-is-deadline" class="text-xs font-bold text-teal-900 select-none cursor-pointer">期限・締め切りとして登録する（カレンダーの締切日に反映）</label>
                </div>

                <!-- Normal Date & Time Fields -->
                <div id="normal-date-fields" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">開始日 <span class="text-rose-500">*</span></label>
                            <input type="date" id="event-start-date" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">開始時間 (任意)</label>
                            <input type="time" id="event-start-time" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">終了日 (期間指定の場合)</label>
                            <input type="date" id="event-end-date" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">終了時間 (任意)</label>
                            <input type="time" id="event-end-time" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                        </div>
                    </div>
                </div>

                <!-- Application Special Fields -->
                <div id="application-date-fields" class="hidden space-y-4 p-4 bg-teal-50/50 rounded-2xl border border-teal-100">
                    <div class="text-xs font-bold text-teal-900">応募関連スケジュール詳細</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">応募開始日時 <span class="text-rose-500">*</span></label>
                            <input type="datetime-local" id="event-app-start" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">応募締切日時 <span class="text-rose-500">*</span></label>

    <div id="alert-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-2xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 text-center">
            <h3 id="alert-title" class="text-base font-bold text-slate-800 mb-2">確認</h3>
            <p id="alert-message" class="text-sm text-slate-600 mb-6 whitespace-pre-wrap"></p>
            <div id="alert-buttons" class="flex justify-center space-x-3">
                <button onclick="closeAlert()" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-xl text-sm font-bold transition w-full shadow-sm">OK</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Data Store
        let events = JSON.parse(localStorage.getItem('oshikatsu_events_v5') || '[]');
        let regulars = JSON.parse(localStorage.getItem('oshikatsu_regulars_v5') || '[]');

        // Active Tab state
        let currentTab = 'calendar'; // 'calendar', 'list', 'deadline', 'regular'
        let calendarMode = 'month'; // 'month', 'week', 'day'

        // Navigation state dates
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth(); // 0-11
        let currentWeekStartDate = getMonday(new Date());
        let currentDayDate = new Date();
        let currentDayDateStr = formatDateKey(new Date());

        const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

        // Category Color Mapping (Soft pastel teal/indigo/slate theme)
        const categoryStyles = {
            "テレビ・配信": "bg-sky-50 text-sky-900 border-sky-200",
            "ラジオ": "bg-purple-50 text-purple-900 border-purple-200",
            "応募": "bg-rose-50 text-rose-900 border-rose-200",
            "購入(グッズ・雑誌など)": "bg-emerald-50 text-emerald-900 border-emerald-200",
            "ライブ": "bg-teal-50 text-teal-900 border-teal-200",
            "イベント": "bg-indigo-50 text-indigo-900 border-indigo-200",
            "その他": "bg-slate-100 text-slate-800 border-slate-200"
        };

        window.onload = function() {
            initDayPicker();
            renderCurrentView();
        };

        function saveData() {
            localStorage.setItem('oshikatsu_events_v5', JSON.stringify(events));
            localStorage.setItem('oshikatsu_regulars_v5', JSON.stringify(regulars));
        }

        // Custom Message Box
        function showAlert(title, message, callback = null) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            const btnContainer = document.getElementById('alert-buttons');
            if (callback) {
                btnContainer.innerHTML = `
                    <button onclick="closeAlert()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition w-1/2">キャンセル</button>
                    <button id="alert-ok-btn" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition w-1/2 shadow-sm">実行する</button>
                `;
                document.getElementById('alert-ok-btn').onclick = function() {
                    closeAlert();
                    callback();
                };
            } else {
                btnContainer.innerHTML = `<button onclick="closeAlert()" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-xl text-sm font-bold transition w-full shadow-sm">OK</button>`;
            }
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alert-modal').classList.add('hidden');
        }

        // Tab Switching
        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-2xs');
                btn.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
                activeBtn.classList.add('bg-slate-900', 'text-white', 'shadow-2xs');
            }

            document.querySelectorAll('.view-container').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            renderCurrentView();
        }

        // Calendar Sub-mode Switching
        function switchCalendarMode(mode) {
            calendarMode = mode;
            document.querySelectorAll('.cal-subview').forEach(el => el.classList.add('hidden'));
            document.getElementById(`cal-subview-${mode}`).classList.remove('hidden');

            const datePicker = document.getElementById('day-date-picker');
            if (mode === 'day') {
                datePicker.classList.remove('hidden');
            } else {
                datePicker.classList.add('hidden');
            }

            updateJumpButtonLabel();
            renderCalendarHeaderTitle();
            renderCalendarSubView();
        }

        function updateJumpButtonLabel() {
            const label = document.getElementById('jump-btn-label');
            if (calendarMode === 'month') label.innerText = '今月に戻る';
            else if (calendarMode === 'week') label.innerText = '今週に戻る';
            else if (calendarMode === 'day') label.innerText = '今日に戻る';
        }

        function renderCurrentView() {
            if (currentTab === 'calendar') {
                updateJumpButtonLabel();
                renderCalendarHeaderTitle();
                renderCalendarSubView();
            } else if (currentTab === 'list') {
                renderListView();
            } else if (currentTab === 'deadline') {
                renderDeadlineView();
            } else if (currentTab === 'regular') {
                renderRegularView();
            }
        }

        function renderCalendarHeaderTitle() {
            const titleEl = document.getElementById('calendar-nav-title');
            if (calendarMode === 'month') {
                titleEl.innerText = `${currentYear}年 ${currentMonth + 1}月`;
            } else if (calendarMode === 'week') {
                const endDate = new Date(currentWeekStartDate);
                endDate.setDate(endDate.getDate() + 6);
                const startStr = `${currentWeekStartDate.getMonth() + 1}/${currentWeekStartDate.getDate()}`;
                const endStr = `${endDate.getMonth() + 1}/${endDate.getDate()}`;
                titleEl.innerText = `${currentWeekStartDate.getFullYear()}年 ${startStr} - ${endStr}`;
            } else if (calendarMode === 'day') {
                const dayOfWeek = WEEKDAYS[currentDayDate.getDay()];
                titleEl.innerText = `${currentDayDate.getFullYear()}年${currentDayDate.getMonth() + 1}月${currentDayDate.getDate()}日(${dayOfWeek})`;
            }
        }

        function changeCalendarDate(delta) {
            if (calendarMode === 'month') {
                currentMonth += delta;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                } else if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
            } else if (calendarMode === 'week') {
                currentWeekStartDate.setDate(currentWeekStartDate.getDate() + (delta * 7));
            } else if (calendarMode === 'day') {
                currentDayDate.setDate(currentDayDate.getDate() + delta);
                currentDayDateStr = formatDateKey(currentDayDate);
                document.getElementById('day-date-picker').value = currentDayDateStr;
            }
            renderCalendarHeaderTitle();
            renderCalendarSubView();
        }

        function jumpToCurrentDate() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            currentWeekStartDate = getMonday(now);
            currentDayDate = now;
            currentDayDateStr = formatDateKey(now);
            const picker = document.getElementById('day-date-picker');
            if (picker) picker.value = currentDayDateStr;

            renderCalendarHeaderTitle();
            renderCalendarSubView();
        }

        function onDayDatePicked(val) {
            if (!val) return;
            currentDayDate = new Date(val);
            currentDayDateStr = val;
            renderCalendarHeaderTitle();
            renderCalendarSubView();
        }

        function initDayPicker() {
            currentDayDateStr = formatDateKey(currentDayDate);
            const picker = document.getElementById('day-date-picker');
            if (picker) picker.value = currentDayDateStr;
        }

        function renderCalendarSubView() {
            if (calendarMode === 'month') renderMonthView();
            else if (calendarMode === 'week') renderWeekView();
            else if (calendarMode === 'day') renderDayView();
        }

        function getFilteredEvents() {
            const catFilter = document.getElementById('filter-category').value;
            const statFilter = document.getElementById('filter-status').value;
            const unhandledOnly = document.getElementById('filter-unhandled-only').checked;
            const keyword = document.getElementById('search-keyword').value.toLowerCase().trim();

            return events.filter(ev => {
                if (catFilter && ev.category !== catFilter) return false;
                if (statFilter && ev.status !== statFilter) return false;
                if (unhandledOnly && ev.status !== '未対応') return false;
                if (keyword) {
                    const matchTitle = ev.title.toLowerCase().includes(keyword);
                    const matchMemo = (ev.memo || '').toLowerCase().includes(keyword);
                    const matchCat = ev.category.toLowerCase().includes(keyword);
                    if (!matchTitle && !matchMemo && !matchCat) return false;
                }
                return true;
            });
        }

        // --- Month View Logic ---
        function renderMonthView() {
            const grid = document.getElementById('month-grid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            let html = '';

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                const prevM = currentMonth === 0 ? 12 : currentMonth;
                const prevY = currentMonth === 0 ? currentYear - 1 : currentYear;
                const dateStr = `${prevY}-${String(prevM).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                html += renderCellHTML(dateStr, dayNum, true);
            }

            for (let d = 1; d <= totalDays; d++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                html += renderCellHTML(dateStr, d, false);
            }

            const totalCellsRendered = firstDayIndex + totalDays;
            const remainingCells = totalCellsRendered <= 35 ? 35 - totalCellsRendered : 42 - totalCellsRendered;
            for (let d = 1; d <= remainingCells; d++) {
                const nextM = currentMonth === 11 ? 1 : currentMonth + 2;
                const nextY = currentMonth === 11 ? currentYear + 1 : currentYear;
                const dateStr = `${nextY}-${String(nextM).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                html += renderCellHTML(dateStr, d, true);
            }

            grid.innerHTML = html;
        }

        function renderCellHTML(dateStr, dayNum, isOutside) {
            const filtered = getFilteredEvents();
            const todayStr = formatDateKey(new Date());
            const isToday = (dateStr === todayStr);

            // Collect items for this date
            let itemsHtml = '';
            let count = 0;

            filtered.forEach(ev => {
                if (ev.category === '応募') {
                    const startD = ev.appStart ? ev.appStart.split('T')[0] : ev.startDate;
                    const endD = ev.appDeadline ? ev.appDeadline.split('T')[0] : ev.endDate;
                    const resD = ev.appResult ? ev.appResult.split('T')[0] : null;

                    if (dateStr === startD) {
                        count++;
                        if (count <= 3) {
                            itemsHtml += `
                                <div onclick="event.stopPropagation(); openDetailModal('${ev.id}')" class="text-[11px] font-medium px-1.5 py-0.5 rounded-lg border bg-rose-50 text-rose-900 border-rose-200 mb-1 cursor-pointer hover:opacity-80 transition shadow-2xs truncate flex items-center">
                                    <span class="text-[9px] bg-rose-600 text-white px-1 rounded mr-1 font-bold">開始</span>${escapeHtml(ev.title)}
                                </div>
                            `;
                        }
                    } else if (dateStr === endD) {
                        count++;
                        if (count <= 3) {
                            itemsHtml += `
                                <div onclick="event.stopPropagation(); openDetailModal('${ev.id}')" class="text-[11px] font-medium px-1.5 py-0.5 rounded-lg border bg-rose-50 text-rose-900 border-rose-200 mb-1 cursor-pointer hover:opacity-80 transition shadow-2xs truncate flex items-center">
                                    <span class="text-[9px] bg-rose-700 text-white px-1 rounded mr-1 font-bold">締切</span>${escapeHtml(ev.title)}
                                </div>
                            `;
                        }
                    } else if (resD && dateStr === resD) {
                        count++;
                        if (count <= 3) {
                            itemsHtml += `
                                <div onclick="event.stopPropagation(); openDetailModal('${ev.id}')" class="text-[11px] font-medium px-1.5 py-0.5 rounded-lg border bg-rose-50 text-rose-900 border-rose-200 mb-1 cursor-pointer hover:opacity-80 transition shadow-2xs truncate flex items-center">
                                    <span class="text-[9px] bg-amber-600 text-white px-1 rounded mr-1 font-bold">当落</span>${escapeHtml(ev.title)}
                                </div>
                            `;
                        }
                    } else if (startD && endD && dateStr > startD && dateStr < endD) {
                        // Between start and deadline: show line/band indicator, no full title
                        count++;
                        if (count <= 3) {
                            itemsHtml += `
                                <div onclick="event.stopPropagation(); openDetailModal('${ev.id}')" class="text-[10px] font-medium px-1.5 py-0.5 rounded-md bg-rose-100/70 text-rose-800 mb-1 cursor-pointer hover:opacity-80 transition truncate flex items-center">
                                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5 inline-block"></span><span class="truncate opacity-80">${escapeHtml(ev.title)}期間</span>
                                </div>
                            `;
                        }
                    }
                } else {
                    // Normal or Deadline checkbox event
                    if (isDateInEventRange(dateStr, ev)) {
                        count++;
                        if (count <= 3) {
                            const badgeStyle = categoryStyles[ev.category] || 'bg-slate-100 text-slate-800';
                            const timeStr = ev.startTime ? `<span class="opacity-75 mr-1">${ev.startTime}</span>` : '';
                            const deadlineTag = ev.isDeadline ? `<span class="text-[9px] bg-rose-600 text-white px-1 rounded mr-1 font-bold">締切</span>` : '';
                            itemsHtml += `
                                <div onclick="event.stopPropagation(); openDetailModal('${ev.id}')" class="text-[11px] font-medium px-1.5 py-0.5 rounded-lg border ${badgeStyle} mb-1 cursor-pointer hover:opacity-80 transition shadow-2xs truncate flex items-center">
                                    ${deadlineTag}${timeStr}${escapeHtml(ev.title)}
                                </div>
                            `;
                        }
                    }
                }
            });

            if (count > 3) {
                itemsHtml += `<div class="text-[10px] text-slate-500 font-bold px-1">+${count - 3}件の他</div>`;
            }

            return `
                <div onclick="openDayPopupModal('${dateStr}')" class="bg-white p-2 min-h-[100px] sm:min-h-[120px] cursor-pointer hover:bg-teal-50/30 transition flex flex-col ${isOutside ? 'bg-slate-50/60 text-slate-400' : 'text-slate-800'}">
                    <div class="flex items-center justify-between mb-1">

        // --- Week View Logic ---
        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

                        const resD = ev.appResult ? ev.appResult.split('T')[0] : null;

                        if (dateStr === startD) {

                            dayItemsHtml += renderAppBadgeMini(ev, '締切', 'bg-rose-50 text-rose-900 border-rose-200');

                            dayItemsHtml += renderAppBadgeMini(ev, '当落', 'bg-amber-50 text-amber-900 border-amber-200');

                weekDaysHtml += `
                    <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col min-h-[450px]">

                            <button onclick="openModalForDate('${dateStr}')" class="text-xs text-slate-600 hover:text-slate-900 font-bold px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 transition whitespace-nowrap">追加</button>

                            ${dayItemsHtml || '<div class="text-xs text-slate-400 text-center py-6 font-medium">予定なし</div>'}

            grid.innerHTML = weekDaysHtml;

        // --- Event Detail View Modal Logic ---
        function openDetailModal(id) {

                linkEl.innerText = ev.link;
            } else {

            const gcalBtn = document.getElementById('detail-gcal-btn');
            gcalBtn.href = generateGoogleCalendarUrl(ev);

            document.getElementById('detail-edit-btn').setAttribute('onclick', `closeDetailModal(); editEvent('${ev.id}')`);
            document.getElementById('detail-delete-btn').setAttribute('onclick', `closeDetailModal(); deleteEvent('${ev.id}')`);

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function generateGoogleCalendarUrl(ev) {
            const title = encodeURIComponent(ev.title);
            const details = encodeURIComponent(ev.memo || '');
            let startStr = ev.startDate ? ev.startDate.replace(/-/g, '') : '';
            let endStr = ev.endDate ? ev.endDate.replace(/-/g, '') : startStr;

            if (ev.category === '応募' && ev.appDeadline) {
                const dt = ev.appDeadline.replace(/[-:]/g, '');
                startStr = dt;
                endStr = dt;
            } else {
                if (ev.startTime) startStr += 'T' + ev.startTime.replace(':', '') + '00';
                else startStr += 'T090000Z';
                if (ev.endTime) endStr += 'T' + ev.endTime.replace(':', '') + '00';
                else endStr += 'T100000Z';
            }

            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startStr}/${endStr}&details=${details}`;
        }

        // --- Deadline View Logic ---

            const filtered = deadlineEvents.filter(ev => {
                if (statFilter && ev.status !== statFilter) return false;
                if (keyword && !ev.title.toLowerCase().includes(keyword) && !(ev.memo || '').toLowerCase().includes(keyword)) return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-sm text-slate-400 text-center py-10 font-medium">応募・締め切り案件はありません。</div>`;

            filtered.sort((a, b) => {

                const dateB = b.category === '応募' ? (b.appDeadline || b.startDate) : b.startDate;

        function openRegularModal() {
            document.getElementById('regular-id').value = '';

            document.getElementById('regular-start-date').value = formatDateKey(new Date());
            document.getElementById('regular-modal').classList.remove('hidden');

            document.getElementById('regular-modal').classList.add('hidden');

        function saveRegular(e) {
            e.preventDefault();
            const id = document.getElementById('regular-id').value || Date.now().toString();
            const title = document.getElementById('regular-title').value;
            const category = document.getElementById('regular-category').value;
            const frequency = document.getElementById('regular-frequency').value;
            const dayOfWeek = parseInt(document.getElementById('regular-dayofweek').value);
            const time = document.getElementById('regular-time').value;
            const endTime = document.getElementById('regular-endtime').value;
            const startDate = document.getElementById('regular-start-date').value;
            const endDate = document.getElementById('regular-end-date').value;
            const count = document.getElementById('regular-count').value ? parseInt(document.getElementById('regular-count').value) : null;
            const link = document.getElementById('regular-link').value;
            const memo = document.getElementById('regular-memo').value;

            const regObj = { id, title, category, frequency, dayOfWeek, time, endTime, startDate, endDate, count, link, memo };
            regulars.push(regObj);

            generateEventsFromRegular(regObj);

            saveData();
            closeRegularModal();
            renderCurrentView();
            showAlert('完了', '定例コンテンツを登録し、スケジュールを展開しました。');
        }

        function generateEventsFromRegular(reg) {
            let curr = new Date(reg.startDate);
            let generatedCount = 0;
            const maxCount = reg.count || 52;

            if (reg.frequency !== 'monthly') {
                while (curr.getDay() !== reg.dayOfWeek) {
                    curr.setDate(curr.getDate() + 1);
                }
            }

            const endDateLimit = reg.endDate ? new Date(reg.endDate) : new Date(curr.getFullYear() + 1, curr.getMonth(), curr.getDate());

            while (generatedCount < maxCount && curr <= endDateLimit) {
                const dateStr = formatDateKey(curr);

                if (reg.endDate && dateStr > reg.endDate) break;

                events.push({
                    id: 'reg_' + reg.id + '_' + Date.now() + '_' + generatedCount,
                    title: reg.title,
                    category: reg.category,
                    status: '未対応',
                    startDate: dateStr,
                    startTime: reg.time || '',
                    endDate: '',
                    endTime: reg.endTime || '',
                    isDeadline: false,
                    appStart: '',
                    appDeadline: '',
                    appResult: '',
                    link: reg.link || '',
                    memo: reg.memo || ''
                });

                generatedCount++;

                if (reg.frequency === 'weekly') {
                    curr.setDate(curr.getDate() + 7);
                } else if (reg.frequency === 'biweekly') {
                    curr.setDate(curr.getDate() + 14);
                } else if (reg.frequency === 'monthly') {
                    curr.setMonth(curr.getMonth() + 1);
                }
            }
        }

        function deleteRegular(id) {
            showAlert('削除確認', 'この定例設定を削除しますか？（すでに生成された個別スケジュールは残ります）', () => {

                saveData();
                renderCurrentView();
            });
        }

            return `
                <div onclick="openDetailModal('${ev.id}')" class="bg-white border border-slate-200 hover:border-teal-300 rounded-2xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 cursor-pointer transition shadow-2xs">
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-xl border ${badgeStyle}">${ev.category}</span>
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-xl ${statusBadge}">${ev.status}</span>
                            ${deadlineBadge}
                            <span class="text-xs font-bold text-slate-600">${dateDisplay}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800">${escapeHtml(ev.title)}</h3>
                        ${ev.memo ? `<p class="text-xs text-slate-600 line-clamp-1">${escapeHtml(ev.memo)}</p>` : ''}
                    </div>
                    <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                        <span class="text-xs font-bold text-teal-600 bg-teal-50 px-3 py-1.5 rounded-xl border border-teal-200 whitespace-nowrap">詳細を見る</span>
                    </div>
                </div>
            `;
        }

        function renderAppCardFull(ev, labelText, badgeStyleClass) {
            const dateDisplay = formatEventDateDisplay(ev);
            const statusBadge = ev.status === '対応済' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900';
            const tagBg = labelText === '開始' ? 'bg-rose-600 text-white' : (labelText === '締切' ? 'bg-rose-700 text-white' : 'bg-amber-600 text-white');

            return `
                <div onclick="openDetailModal('${ev.id}')" class="bg-white border border-rose-200 hover:border-teal-300 rounded-2xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 cursor-pointer transition shadow-2xs">
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-xl border bg-rose-50 text-rose-900 border-rose-200">応募</span>
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-xl ${statusBadge}">${ev.status}</span>
                            <span class="text-xs font-bold px-2 py-0.5 rounded-xl ${tagBg}">${labelText}</span>
                            <span class="text-xs font-bold text-slate-600">${dateDisplay}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800">${escapeHtml(ev.title)}</h3>
                        ${ev.memo ? `<p class="text-xs text-slate-600 line-clamp-1">${escapeHtml(ev.memo)}</p>` : ''}
                    </div>
                    <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                        <span class="text-xs font-bold text-teal-600 bg-teal-50 px-3 py-1.5 rounded-xl border border-teal-200 whitespace-nowrap">詳細を見る</span>
                    </div>
                </div>
            `;
        }

        // --- Event Modal & Actions ---
        function openModal() {
            document.getElementById('event-id').value = '';
            document.getElementById('event-form').reset();
            document.getElementById('event-start-date').value = formatDateKey(new Date());
            document.getElementById('event-is-deadline').checked = false;
            toggleCategoryFields();
            document.getElementById('modal-title').innerText = '新規スケジュール追加';
            document.getElementById('event-modal').classList.remove('hidden');
        }

        function openModalForDate(dateStr) {
            openModal();
            document.getElementById('event-start-date').value = dateStr;
            const nowTime = new Date();
            const tmStr = String(nowTime.getHours()).padStart(2, '0') + ':' + String(nowTime.getMinutes()).padStart(2, '0');
            document.getElementById('event-app-start').value = `${dateStr}T${tmStr}`;
            document.getElementById('event-app-deadline').value = `${dateStr}T23:59`;
        }

        function closeModal() {
            document.getElementById('event-modal').classList.add('hidden');
        }

        function toggleCategoryFields() {
            const cat = document.getElementById('event-category').value;
            const normalFields = document.getElementById('normal-date-fields');
            const appFields = document.getElementById('application-date-fields');
            const deadlineCheckboxContainer = document.getElementById('deadline-checkbox-container');

            if (cat === '応募') {
                normalFields.classList.add('hidden');
                appFields.classList.remove('hidden');
                deadlineCheckboxContainer.classList.add('hidden');
            } else {
                normalFields.classList.remove('hidden');
                appFields.classList.add('hidden');
                deadlineCheckboxContainer.classList.remove('hidden');
            }
        }

        function editEvent(id) {
            const ev = events.find(item => item.id === id);
            if (!ev) return;

            document.getElementById('event-id').value = ev.id;
            document.getElementById('event-title').value = ev.title;
            document.getElementById('event-category').value = ev.category;
            document.getElementById('event-status').value = ev.status;
            document.getElementById('event-start-date').value = ev.startDate || '';
            document.getElementById('event-start-time').value = ev.startTime || '';
            document.getElementById('event-end-date').value = ev.endDate || '';
            document.getElementById('event-end-time').value = ev.endTime || '';
            document.getElementById('event-is-deadline').checked = !!ev.isDeadline;
            document.getElementById('event-app-start').value = ev.appStart || '';
            document.getElementById('event-app-deadline').value = ev.appDeadline || '';
            document.getElementById('event-app-result').value = ev.appResult || '';
            document.getElementById('event-link').value = ev.link || '';
            document.getElementById('event-memo').value = ev.memo || '';

            toggleCategoryFields();
            document.getElementById('modal-title').innerText = 'スケジュール編集';
            document.getElementById('event-modal').classList.remove('hidden');
        }

        function saveEvent(e) {
            e.preventDefault();
            const id = document.getElementById('event-id').value || Date.now().toString();
            const title = document.getElementById('event-title').value;
            const category = document.getElementById('event-category').value;
            const status = document.getElementById('event-status').value;
            const isDeadline = document.getElementById('event-is-deadline').checked;
            const link = document.getElementById('event-link').value;
            const memo = document.getElementById('event-memo').value;

            let startDate = '', startTime = '', endDate = '', endTime = '';
            let appStart = '', appDeadline = '', appResult = '';

            if (category === '応募') {
                appStart = document.getElementById('event-app-start').value;
                appDeadline = document.getElementById('event-app-deadline').value;
                appResult = document.getElementById('event-app-result').value;
                if (!appStart || !appDeadline) {
                    showAlert('入力エラー', '応募開始日時と応募締切日時は必須です。');
                    return;
                }
                startDate = appStart.split('T')[0];
                endDate = appDeadline.split('T')[0];
            } else {
                startDate = document.getElementById('event-start-date').value;
                startTime = document.getElementById('event-start-time').value;
                endDate = document.getElementById('event-end-date').value;
                endTime = document.getElementById('event-end-time').value;
                if (!startDate) {
                    showAlert('入力エラー', '開始日は必須です。');
                    return;
                }
            }

            const eventData = { id, title, category, status, startDate, startTime, endDate, endTime, isDeadline, appStart, appDeadline, appResult, link, memo };

            const existingIndex = events.findIndex(item => item.id === id);
            if (existingIndex >= 0) {
                events[existingIndex] = eventData;
            } else {
                events.push(eventData);
            }

            saveData();
            closeModal();
            renderCurrentView();
        }

        function deleteEvent(id) {
            showAlert('削除確認', 'このスケジュールを削除しますか？', () => {
                events = events.filter(item => item.id !== id);
                saveData();
                renderCurrentView();
            });
        }

        // --- Utility Functions ---
        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function isDateInEventRange(dateStr, ev) {
            if (ev.category === '応募') {
                return false; // Handled separately in renderers
            }
            if (ev.isDeadline) {
                return ev.startDate === dateStr;
            }
            const start = ev.startDate;
            const end = ev.endDate || start;
            return dateStr >= start && dateStr <= end;
        }

        function formatEventDateDisplay(ev) {
            if (ev.category === '応募' && ev.appDeadline) {
                return `開始: ${formatDateTimeDisplay(ev.appStart)} 〜 締切: ${formatDateTimeDisplay(ev.appDeadline)}`;
            }
            const sDateObj = new Date(ev.startDate);
            const sDayOfWeek = WEEKDAYS[sDateObj.getDay()];
            let str = `${ev.startDate}(${sDayOfWeek})`;
            if (ev.startTime) str += ` ${ev.startTime}`;
            if (ev.endDate && ev.endDate !== ev.startDate) {
                const eDateObj = new Date(ev.endDate);
                const eDayOfWeek = WEEKDAYS[eDateObj.getDay()];
                str += ` 〜 ${ev.endDate}(${eDayOfWeek})`;
                if (ev.endTime) str += ` ${ev.endTime}`;
            } else if (ev.endTime) {
                str += ` 〜 ${ev.endTime}`;
            }
            return str;
        }

        function formatDateTimeDisplay(dtStr) {
            if (!dtStr) return '';
            const [datePart, timePart] = dtStr.split('T');
            if (!datePart) return dtStr;
            const dObj = new Date(datePart);
            const dayOfWeek = WEEKDAYS[dObj.getDay()];
            return `${datePart.replace(/-/g, '/')}(${dayOfWeek}) ${timePart || ''}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
